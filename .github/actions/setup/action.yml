# Shared job setup for .github/workflows/build.yml: Temurin 21 (the build JDK), Gradle with its cache, the OpenSSL reuse
# property, and on request the pinned NDK, the pinned Xcode, the Kotlin/Native toolchain and the OpenSSL build cache.
name: kuicksilver setup
description: JDK 21, Gradle, and the pinned NDK / Xcode / Kotlin/Native / OpenSSL cache a job asks for
inputs:
  ndk:
    description: install the NDK pinned in gradle/toolchains.toml and export ANDROID_NDK_ROOT and LLVM_* (llvm-objcopy, llvm-nm, llvm-ar, ...)
    default: 'false'
  xcode:
    description: select the Xcode pinned in gradle/toolchains.toml (macOS)
    default: 'false'
  konan:
    description: restore ~/.konan and provision the Kotlin/Native toolchain (tools/ci/konan-bootstrap.sh) for these konan targets
    default: ''
  openssl-cache:
    description: name of the OpenSSL build cache (tools/openssl/build.sh's own cache directory and the source tarball); empty = none
    default: ''
  pin:
    description: the OpenSSL pin profile the cache key hashes (gradle/openssl-next.toml for the openssl-next job)
    default: gradle/openssl.toml
runs:
  using: composite
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: '21'
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        # main writes the cache every branch reads; a manual run of a branch also writes its own (scoped to that branch)
        cache-read-only: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}
    - name: Gradle properties for CI
      shell: bash
      run: |
        # OpenSSL builds downloaded from another job (or restored from the cache) are reused, never rebuilt (kuicksilver-native/openssl.gradle.kts)
        mkdir -p "${GRADLE_USER_HOME:-$HOME/.gradle}"
        # and the mirror of Maven Central as the last repository (settings.gradle.kts)
        printf 'kuicksilver.openssl.prebuilt=true\norg.gradle.java.installations.auto-download=false\nkuicksilver.centralMirror=true\n' >> "${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"
    - name: Gradle plugin class path (a dependency not found is asked for once more, past the cached miss)
      shell: bash
      run: |
        # Maven Central answers 404 for files it has now and then, also behind the Gradle Plugin Portal's redirect (runs
        # 44630132347, 44657561143, 44674970605: four jobs). A module missing from every repository falls
        # back to the mirror of Central (settings.gradle.kts); a missing file of a found module (jose4j-0.9.6.jar) is
        # recorded in the Gradle user home for 24 hours (DefaultCachePolicy), and setup-gradle saves that home after a
        # failed build too. `help` in the root build resolves what every Gradle step needs first: build-logic as the
        # included plugin build (its compile and runtime class paths, with the plugins' own dependencies) under the root's
        # gradle/verification-metadata.xml, in the daemon the later steps reuse. gradlew-retry.sh runs it once more with
        # --refresh-dependencies after a dependency was not found, as $G does for every later Gradle step. Every job that
        # uses this action runs Gradle.
        KSL_GRADLE_RETRY_QUIET=1 bash tools/ci/gradlew-retry.sh --max-workers=2 -q help
    - name: Pinned Xcode
      if: inputs.xcode == 'true'
      shell: bash
      run: |
        v=$(sed -n 's/^xcode = "\(.*\)".*/\1/p' gradle/toolchains.toml)
        app=$(ls -d "/Applications/Xcode_$v.app" /Applications/Xcode_"$v".*.app 2>/dev/null | head -1 || true)
        [ -n "$app" ] || { echo "::error::Xcode $v (gradle/toolchains.toml) is not on this runner image; installed: $(ls -d /Applications/Xcode_* | tr '\n' ' ')"; exit 1; }
        sudo xcode-select -s "$app/Contents/Developer"; xcodebuild -version
    - name: Pinned NDK
      if: inputs.ndk == 'true'
      shell: bash
      run: |
        pin=$(sed -n 's/^ndk = "\(.*\)".*/\1/p' gradle/toolchains.toml)
        sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"; sm="$sdk/cmdline-tools/latest/bin/sdkmanager"
        [ -x "$sm" ] || { echo "::error::no sdkmanager under ANDROID_HOME=$sdk"; exit 1; }
        # `yes` dies of SIGPIPE once sdkmanager exits; under pipefail that alone would fail the step, so its status is ignored
        if [ ! -d "$sdk/ndk/$pin" ]; then
          { yes || true; } | "$sm" --install "ndk;$pin" > "$RUNNER_TEMP/sdkmanager.log" 2>&1 \
            || { tail -30 "$RUNNER_TEMP/sdkmanager.log"; echo "::error::sdkmanager could not install ndk;$pin"; exit 1; }
        fi
        ndk="$sdk/ndk/$pin"; rev=$(sed -n 's/^Pkg.Revision *= *//p' "$ndk/source.properties")
        [ "$rev" = "$pin" ] || { echo "::error::NDK at $ndk is $rev, pinned $pin"; exit 1; }
        bin=$(ls -d "$ndk"/toolchains/llvm/prebuilt/*/bin)
        { echo "ANDROID_NDK_ROOT=$ndk"; echo "ANDROID_NDK_HOME=$ndk"
          for t in nm objcopy objdump readelf ar; do echo "LLVM_$(echo "$t" | tr '[:lower:]' '[:upper:]')=$bin/llvm-$t"; done; } >> "$GITHUB_ENV"
        echo "NDK $rev at $ndk"
    - name: Kotlin/Native toolchain cache
      if: inputs.konan != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}-${{ inputs.konan }}
    - name: Kotlin/Native toolchain
      if: inputs.konan != ''
      shell: bash
      env:
        KONAN_TARGETS: ${{ inputs.konan }}
      run: |
        # shellcheck disable=SC2086
        bash tools/ci/konan-bootstrap.sh $KONAN_TARGETS
    - name: OpenSSL build cache
      if: inputs.openssl-cache != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          build/openssl-work/cache
          build/openssl-work/src/*.tar.gz
          build/openssl-work/src/*.tar.gz.asc
        key: openssl-${{ inputs.openssl-cache }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(inputs.pin, 'gradle/compression-libs.toml', 'gradle/toolchains.toml', 'tools/openssl/**') }}
