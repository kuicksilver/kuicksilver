# CI matrix. The same steps as tools/ci/local-matrix.sh, which runs them on the owner's macOS host: both take the
# module and interop case lists from tools/ci/matrix.sh, and step names match so a red step maps to a local one.
# Runs on every push to main and release/**, every pull request to them, weekly (the whole matrix plus the QUIC Interop
# Runner), and by hand (the `only` input picks jobs). Nothing here publishes, signs or reads a secret: every job has
# contents: read, so a pull request from a fork (pull_request, never pull_request_target) runs with the same rights as
# any other; publishing is release.yml and interop-image.yml, both dispatch-only.
#
#   lint ──────────────────────────────────────────────── pins, SPDX, script syntax
#   openssl-docker (linux-x64, linux-arm64, mingw-x64 + the Windows JNI dll) ─┬─ linux (x64, arm64): manylinux C tests, .so, JVM suites, system OpenSSL
#                                                        ├─ linux-native: -kn OpenSSL, test.kexe x64 + arm64, mingw test.exe + ksl_test.exe ── windows
#                                                        ├─ apple (macOS arm64): ABI dumps, ASan C tests, JVM + macosArm64 suites, Intel-Mac dylib, repro
#                                                        └─ interop-images ── interop (weekly / dispatch): JVM and native image × 6 peers
#   openssl-docker ── windows-jvm (windows-2025): the JVM suites against the mingw-w64 JNI dll
#   openssl-docker ── windows-loops-bench (windows-2025, dispatch with only=windows-loops-bench): MultiLoopBenchmark, not a gate
#   openssl-docker + linux + apple ── jvm-jar: the kuicksilver-native jar with all five JNI libraries ── consumer-smoke (mavenLocal)
#   JNI artifacts jni-<classifier> (tools/build-jni.sh output dirs; .github/workflows/release.yml reuses them from the green run):
#     linux-x86_64, linux-aarch_64 ← linux · osx-aarch_64, osx-x86_64 ← apple · windows-x86_64 ← openssl-docker (mingw-x64)
#   android (API 24, 35): AAR (arm64-v8a, x86_64, armeabi-v7a), size and 16 KiB gates, emulator tests
#   linux ── jdk-compat (JDK 17 API, tests on 17 / 25)
#   openssl-next (linux-x64, macos-arm64; weekly, or dispatch with only=openssl-next): the newest OpenSSL 4.x (gradle/openssl-next.toml) built
#     natively, the ksl C tests and a JVM smoke test against it. continue-on-error, needs nothing, nothing needs it, no artifact is kept:
#     0.3.0 ships OpenSSL 3.5 LTS only (docs/stability.md, OpenSSL).
name: build
on:
  # Documentation-only changes run the whole matrix too (no paths-ignore): the lint job checks the docs (doc-refs, links,
  # the RFC table, guide-sync) and the JVM suites compile and run the guides' code samples (GuideSamplesTest).
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  schedule:
    - cron: '17 3 * * 1'   # weekly (Monday 03:17 UTC): the whole matrix plus the QUIC Interop Runner
  workflow_dispatch:
    inputs:
      only:
        description: comma-separated jobs to run (e.g. lint,apple); empty runs all; openssl-docker always runs; windows-loops-bench (MultiLoopBenchmark on Windows) and openssl-next (OpenSSL 4.x, not a gate) run only when named, or openssl-next in the weekly run
        type: string
        default: ''
      interop:
        description: also run the QUIC Interop Runner matrix (hours)
        type: boolean
        default: false
permissions: {}
concurrency:
  # A newer push to a pull request cancels its older run: the workflow publishes nothing. A push to main or release/**
  # is never cancelled, nor left pending behind another: each push has a group of its own (its commit), because the lint
  # job checks the fuzz formats against the commit before the push (github.event.before), so a cancelled push would
  # leave its changes unchecked; release.yml asks for a green run of the release commit, which every push still gets.
  # Scheduled and manual runs have groups of their own and are never cancelled by a push.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
env:
  # every Gradle step: a run that failed on a dependency Central answered "not found" for (no test and no dependency
  # verification failed) runs once more with --refresh-dependencies (tools/ci/gradlew-retry.sh)
  G: bash tools/ci/gradlew-retry.sh --stacktrace
  # the leak sentinel fails a test whose teardown is slow, not only one that leaks (docs/process.md)
  KUICKSILVER_LEAK_STRICT: "1"

jobs:
  lint:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',lint,')) }}
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    timeout-minutes: 45
    steps:
      # the whole history (fuzz-formats.py compares the fuzz formats with a base commit, below); release tags come with it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: 'lint: fetch main and the release tags (fuzz-formats base; config-table.sh checks Since against the tags)'
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git fetch origin 'refs/tags/v*:refs/tags/v*'
      - name: 'lint: the base the fuzz-formats reason rule compares with'
        # a push to main or release/**: the commit before it (github.event.before; none for a new branch, all zeros);
        # anything else (a pull request, a dispatched or weekly run of another branch): its merge base with origin/main.
        # Empty when there is none, and fuzz-formats.py then skips the rule and says so.
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          else
            base=$(git merge-base HEAD origin/main 2>/dev/null || true)
          fi
          echo "fuzz-formats base: ${base:-none}"
          echo "KSL_FUZZ_FORMATS_BASE=$base" >> "$GITHUB_ENV"
      - name: 'lint: action/image pins'
        run: bash tools/check/pins.sh .
      - name: 'lint: documentation references'
        run: |
          bash tools/check/doc-refs.sh
          python3 -I tools/check/code-refs.py   # the source lines docs/spec cites, against tools/check/code-refs.lock
      - name: 'lint: tests that can run and fail, sleeps, name-service calls, tests behind RFC rows'
        # docs/process.md, "Repository checks"; the commit types and cited hashes are checked by local-matrix.sh over
        # main..HEAD (commit-msg-test.sh runs below)
        run: |
          rc=0
          python3 -I tools/check/test-discovery.py || rc=1
          python3 -I tools/check/test-count.py || rc=1    # the floor in tools/check/test-count.lock
          python3 -I tools/check/test-sleeps.py || rc=1   # the ratchet in tools/check/test-sleeps.lock
          python3 -I tools/check/env-apis.py || rc=1      # allowlist tools/check/env-apis.allow
          python3 -I tools/check/rfc-tests.py || rc=1     # the ratchet in tools/check/rfc-tests.lock
          python3 -I tools/check/reproducers.py || rc=1   # every fuzz reproducer recorded in tools/fuzz/reproducers.txt
          python3 -I tools/check/fuzz-formats.py || rc=1  # tools/fuzz/formats/, the reason rule against KSL_FUZZ_FORMATS_BASE
          python3 -I tools/check/deadline-sites.py || rc=1 # every deadline judged in tools/check/deadline-sites.allow
          python3 -I tools/check/test-hooks.py || rc=1    # global *ForTest hooks a test sets are reset
          python3 -I tools/check/select-races.py || rc=1  # selects racing started work judged in tools/check/select-races.allow
          python3 -I tools/check/race-tests.py || rc=1    # race tests force their order, or tools/check/race-tests.allow says why not
          python3 -I tools/check/wall-bounds.py || rc=1   # wall-clock bounds of tests with their numbers in tools/check/wall-bounds.allow
          python3 -I tools/check/tracked-hashes.py || rc=1  # cited hashes in tracked files
          python3 -I tools/check/wildcard-binds.py || rc=1  # test sockets reached over loopback bind loopback
          python3 -I tools/check/sentinel.py || rc=1   # the leak sentinel's allowlist only shrinks (tools/check/sentinel.allow)
          exit $rc
      - name: 'lint: doc-refs and test-check negative controls'
        run: |
          rc=0
          for t in doc-refs code-refs test-discovery test-bytecode test-count test-sleeps env-apis rfc-tests reproducers fuzz-formats commit-msg deadline-sites test-hooks select-races race-tests wall-bounds tracked-hashes wildcard-binds sentinel; do
            bash "tools/check/$t-test.sh" || rc=1
          done
          exit $rc
      - name: 'lint: race tests to repeat under load (list) and its negative controls'
        # the 10 runs under load are the local gate's, before its step 1 (docs/process.md, "Repository checks"); here the
        # selection is checked on stubs and listed against the same base as fuzz-formats
        run: |
          bash tools/ci/race-repeat-test.sh
          if [ -n "$KSL_FUZZ_FORMATS_BASE" ]; then bash tools/ci/race-repeat.sh --list --base "$KSL_FUZZ_FORMATS_BASE"
          else echo "race-repeat: no base commit, nothing listed"; fi
      - name: 'lint: fuzz campaign.sh on paths with spaces (stubs)'
        run: bash tools/fuzz/campaign-test.sh
      - name: 'lint: interop peer-image check and environment rules (stubs, fixtures)'
        run: |
          bash tools/interop/peer-images-test.sh
          bash tools/interop/environment-test.sh
      - name: 'lint: reliability report (fixtures)'
        run: bash tools/report/reliability-test.sh
      - name: 'check: local-matrix step selection'
        # --dry-run only: no Gradle, Docker, OpenSSL or emulator; then the module scope of its old-platform steps and the API 24
        # emulator script's checks against a fake adb
        run: bash tools/ci/local-matrix-test.sh && bash tools/ci/changed-modules-test.sh && bash tools/ci/avd-api24-test.sh
      - name: 'check: android connected-test retry (fake gradlew)'
        run: bash tools/ci/android-connected-check-test.sh
      - name: 'check: Gradle retry after a dependency not found (fake gradlew)'
        run: bash tools/ci/gradlew-retry-test.sh
      - name: 'lint: RFC compliance summary table'
        run: |
          bash tools/check/rfc-table.sh
          bash tools/check/rfc-table-test.sh
      - name: 'lint: HPACK tables and vectors (http2 and http3 agree)'
        run: python3 tools/http/gen-tables.py --check
      - name: 'lint: links (Markdown, llms.txt)'
        run: bash tools/check/links.sh
      - name: 'lint: the published documentation names no local path (build-paths over the site sources)'
        # pages.yml scans the built pages too, but only after a push to main: a /tmp path in a guide sample failed there
        run: |
          bash tools/check/site-paths.sh
          bash tools/check/site-paths-test.sh
      - name: 'lint: guide code samples match GuideSamplesTest'
        run: |
          bash tools/check/guide-sync.sh
          bash tools/check/guide-sync-test.sh
      - name: 'lint: configuration tables match the configuration classes'
        run: |
          bash tools/check/config-table.sh
          bash tools/check/config-table-test.sh
      - name: 'lint: troubleshooting messages exist in the source'
        run: |
          bash tools/check/troubleshooting-msgs.sh
          bash tools/check/troubleshooting-msgs-test.sh
      - name: 'lint: FuzzCase.kt is the same in every fuzz package'
        run: |
          bash tools/check/fuzz-case-sync.sh
          bash tools/check/fuzz-case-sync-test.sh
      - name: 'lint: llms-full.txt is current'
        run: |
          bash tools/check/llms-full.sh --check
          bash tools/check/llms-full-test.sh
      - name: 'lint: documentation site tools (guide rendering, versions, link check)'
        # the guide renderer is pinned by hash in tools/docs/requirements.txt, like clang-format below
        run: |
          python3 -m venv "$RUNNER_TEMP/docs-venv"
          "$RUNNER_TEMP/docs-venv/bin/pip" install --quiet --require-hashes -r tools/docs/requirements.txt
          DOCS_PYTHON="$RUNNER_TEMP/docs-venv/bin/python" bash tools/docs/site-test.sh
      - name: 'lint: verification pages (tools/docs/verify.py on fixtures, negative controls)'
        run: bash tools/docs/verify-test.sh
      - name: 'lint: SPDX headers'
        run: bash tools/check/spdx.sh .
      - name: 'lint: C formatting (clang-format, .clang-format)'
        # minor releases change the layout: tools/check/clang-format.sh requires the exact version pinned in tools/check/clang-format-requirements.txt
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-format-venv"
          "$RUNNER_TEMP/clang-format-venv/bin/pip" install --quiet --require-hashes -r tools/check/clang-format-requirements.txt
          CLANG_FORMAT="$RUNNER_TEMP/clang-format-venv/bin/clang-format" bash tools/check/clang-format.sh
      - name: 'lint: shell syntax'
        run: |
          rc=0; while IFS= read -r f; do bash -n "$f" || rc=1; done < <(git ls-files '*.sh'); exit $rc
      - name: 'lint: shellcheck (errors)'
        run: git ls-files '*.sh' | xargs shellcheck -S error
      - uses: ./.github/actions/setup
      - name: 'lint: ktlint'
        # kotlinter's lintKotlin only parses sources: no Kotlin/Native toolchain, OpenSSL or NDK is needed
        run: $G --max-workers=2 lintKotlin
      - name: 'check: dependency verification (every configuration)'
        # resolves every configuration of every project with verification on: an artifact gradle/verification-metadata.xml does
        # not cover fails here, not in the one late job that happens to resolve it (CONTRIBUTING.md, "Dependency verification")
        run: $G --max-workers=2 -I tools/check/resolve-all.init.gradle.kts -Pkuicksilver.resolveAll.strict=true --continue :build-logic:ksResolveAll ksResolveAll

  openssl-docker:
    # The container-built OpenSSL targets, shared with the other jobs as artifacts (they reuse them through
    # kuicksilver.openssl.prebuilt=true, set by .github/actions/setup). The -kn targets are built on the host with the
    # Kotlin/Native clang (tools/openssl/build.sh) by the jobs that need them, never here.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: mingw-x64, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    permissions: { contents: read }
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/openssl-work/cache
            build/openssl-work/src/*.tar.gz
            build/openssl-work/src/*.tar.gz.asc
          key: openssl-docker-${{ matrix.target }}-${{ runner.arch }}-${{ hashFiles('gradle/openssl.toml', 'gradle/compression-libs.toml', 'tools/openssl/**') }}
      - name: 'env: nothing that changes a native build is set'
        # the libraries built here are those a release reuses (tools/clean-build-env.sh, ksl_build_env_guard: the values the
        # setup action sets on purpose, the pinned NDK's LLVM tools, pass)
        run: |
          . tools/clean-build-env.sh
          set_vars=$(ksl_build_env_guard)
          [ -z "$set_vars" ] || { echo "::error::set on this runner: $set_vars (tools/clean-build-env.sh)"; exit 1; }
      - name: 'openssl: fetch and verify'
        run: bash tools/openssl/fetch.sh
      - name: 'openssl: build ${{ matrix.target }}'
        run: bash tools/openssl/build-docker.sh ${{ matrix.target }}
      - name: 'openssl: no-sslkeylog (${{ matrix.target }})'
        run: bash tools/check/keylog-disabled.sh build/openssl/${{ matrix.target }}/include
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openssl-${{ matrix.target }}
          path: build/openssl/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
      - name: 'docker: JNI library windows-x86_64 (mingw)'
        if: matrix.target == 'mingw-x64'
        run: bash tools/ci/jni-windows.sh build/jni-windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.target == 'mingw-x64'
        with:
          name: jni-windows-x86_64
          path: build/jni-windows
          if-no-files-found: error
          retention-days: 7

  linux:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',linux,')) }}
    # Linux JVM path end to end in the manylinux2014 images (glibc 2.17 floor): C tests, libksl.so, its exports and glibc floor,
    # then every module's JVM suite on the host JVM against that .so (tools/ci/docker-jvm.sh). arm64 runs on an arm64 runner
    # (native first, qemu-user only as a fallback — it lacks io_uring and parts of the UDP socket options).
    needs: openssl-docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: ubuntu-24.04, target: linux-x64, classifier: linux-x86_64, platform: linux/amd64 }
          - { arch: arm64, os: ubuntu-24.04-arm, target: linux-arm64, classifier: linux-aarch_64, platform: linux/arm64 }
    runs-on: ${{ matrix.os }}
    permissions: { contents: read }
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: 'openssl-${{ matrix.target }}'
          path: 'build/openssl/${{ matrix.target }}'
      - name: LLVM binutils for the checks
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends llvm
      - name: 'docker: image ${{ matrix.target }}'
        run: bash tools/openssl/build-docker.sh --image ${{ matrix.target }}
      # the ICMP error-queue tests (udp_recverr_*) run in a user and network namespace: Ubuntu 24.04 restricts unprivileged user
      # namespaces through AppArmor and Docker's default seccomp profile refuses unshare(CLONE_NEWUSER), so both are lifted for this
      # container, and the step fails when the tests still skipped (as tools/ci/local-matrix.sh's docker_ctests)
      - name: 'host: allow unprivileged user namespaces'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: 'docker: c-tests ${{ matrix.target }}'
        env: { KSL_DOCKER_OPTS: '--security-opt seccomp=unconfined' }
        run: |
          rc=0; out=$(bash tools/ci/docker-run.sh ${{ matrix.platform }} kuicksilver-openssl-${{ matrix.target }} "CC=/opt/rh/devtoolset-10/root/usr/bin/gcc SAN= bash tools/c-test.sh ${{ matrix.target }}" 2>&1) || rc=$?   # the shell runs with -e
          printf '%s\n' "$out"
          [ "$rc" = 0 ] || exit "$rc"
          grep -q 'udp_recverr_ptb_parsed: OK' <<< "$out" || { echo "udp_recverr_ptb_parsed did not run (SKIP)"; exit 1; }
          grep -q 'udp_fd_df_probe_forged_ptb: OK' <<< "$out" || { echo "udp_fd_df_probe_forged_ptb did not run (SKIP)"; exit 1; }
      - name: 'docker: jvm ${{ matrix.target }} (.so + tests)'
        run: bash tools/ci/docker-jvm.sh ${{ matrix.classifier }}
      - name: 'verify: results for the documentation site (tools/docs/verify.py)'
        if: '!cancelled()'
        env: { ARCH: '${{ matrix.arch }}' }
        run: |
          python3 -I tools/docs/verify.py collect --lane "linux-$ARCH" --host "Linux $ARCH" --out "$RUNNER_TEMP/verify/linux-$ARCH.json" \
            --junit 'jvm:*/build/test-results/jvmTest/*.xml'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: '!cancelled()'
        with: { name: 'verify-linux-${{ matrix.arch }}-a${{ github.run_attempt }}', path: '${{ runner.temp }}/verify', if-no-files-found: error, retention-days: 30 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jni-${{ matrix.classifier }}
          path: kuicksilver-native/build/jni
          if-no-files-found: error
          retention-days: 7
      - name: 'docker: system OpenSSL mode'
        if: matrix.arch == 'x64'
        run: bash tools/ci/system-openssl.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: 'reports-linux-${{ matrix.arch }}'
          path: '**/build/reports/tests/'
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # a test JVM out of heap leaves its heap dump there (the kuicksilver.test-jvm plugin)
        if: failure()
        with:
          name: 'heap-dumps-linux-${{ matrix.arch }}'
          path: '**/build/test-heap-dumps/'
          if-no-files-found: ignore
          retention-days: 7

  linux-native:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',linux-native,')) }}
    # Kotlin/Native for Linux and Windows: the -kn OpenSSL builds with the konan clang and sysroots, the prefixed archives, the
    # test executables; test.kexe x64 runs in the manylinux image, the arm64 ones go to linux-native-arm64 (a native arm64
    # runner: under QEMU the real-time suites ran 10-50x slower and timed out, run 38287900994), the mingw test.exe to windows.
    needs: openssl-docker
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { ndk: 'true', konan: 'linux_x64 linux_arm64 mingw_x64', openssl-cache: linux-native }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: openssl-mingw-x64, path: build/openssl/mingw-x64 }
      - name: 'native: link linux/mingw tests'
        run: |
          . tools/ci/matrix.sh
          # shellcheck disable=SC2046,SC2086   # the lists split into Gradle task paths on purpose
          $G $(ksl_tasks linkDebugTestLinuxX64 $KSL_LINK_MODULES) $(ksl_tasks linkDebugTestLinuxArm64 $KSL_LINK_MODULES) $(ksl_tasks linkDebugTestMingwX64 $KSL_LINK_MODULES)
      - name: 'c-tests: mingw-x64 (cross-built, -Werror; run by windows)'
        # the ksl C tests (test_udp_win.c among them) with the Kotlin/Native llvm + mingw sysroot the link step fetched;
        # only system DLLs are imported, so the exe runs as is on the windows runner
        run: bash tools/c-test.sh mingw-x64
      - name: 'native: glibc floors'
        run: bash tools/check/glibc-floor.sh kuicksilver-native/build/bin/linuxX64/debugTest/test.kexe 2.19 && bash tools/check/glibc-floor.sh kuicksilver-native/build/bin/linuxArm64/debugTest/test.kexe 2.25
      - name: 'native: prefix whitelist (linux/mingw)'
        run: for t in linux-x64-kn linux-arm64-kn mingw-x64; do bash tools/prefix/check-no-unprefixed.sh build/openssl-prefixed/$t/lib || exit 1; done
      - name: 'docker: image linux-x64'
        run: bash tools/openssl/build-docker.sh --image linux-x64
      - name: 'docker: test.kexe linux-x64 (all modules)'
        # a hosted runner leaves a connect to TEST-NET-1 undecided: TcpSocketsNativeTest's test of that path may not skip
        # itself here (docs/process.md, "Hosted CI"); the owner's Docker sits behind a TUN that answers it, so not there
        env: { KSL_DOCKER_OPTS: '-e KSL_REQUIRE_UNDECIDED_CONNECT=1', KSL_KEXE_LOG_DIR: '${{ runner.temp }}/verify-logs/linuxX64' }
        run: |
          . tools/ci/matrix.sh
          # shellcheck disable=SC2086   # the module list splits into arguments on purpose
          bash tools/ci/run-kexe.sh linux/amd64 kuicksilver-openssl-linux-x64 linuxX64 $KSL_LINK_MODULES
      - name: 'docker: deployment guide commands (linux-x64)'
        # docs/guide/deployment.md "Checking a deployment" (curl --http3-only, tcpdump) against the linuxX64 server in one container
        run: KSL_GRADLE="$G" bash tools/check/deployment-guide.sh
      - name: 'docker: h2spec linux-x64 (HTTP/2 server; TLS, and h2c where tools/interop/h2spec.sh has it)'
        # the release gate's h2spec run (tools/ci/local-matrix.sh) on the linuxX64 server: every case must pass. The image
        # is the digest pin of h2spec.sh itself, pulled here (the script never pulls). The script lists the runs it makes
        # (build/h2spec/variants.txt: one per transport, TLS and h2c) and the next step reads each one's report
        run: |
          image=$(sed -n 's/^image="\(summerwind\/h2spec:[^"]*@sha256:[0-9a-f]\{64\}\)"$/\1/p' tools/interop/h2spec.sh)
          [ -n "$image" ] || { echo "::error::no digest-pinned image= line in tools/interop/h2spec.sh"; exit 1; }
          docker pull --platform linux/amd64 "$image"
          KSL_GRADLE="$G" bash tools/interop/h2spec.sh linux-x64
      - name: 'verify: results for the documentation site (tools/docs/verify.py)'
        if: '!cancelled()'
        run: |
          python3 -I tools/docs/verify.py collect --lane linux-native --host 'Linux x64 (manylinux2014 container)' \
            --out "$RUNNER_TEMP/verify/linux-native.json" --gtest "linuxX64:$RUNNER_TEMP/verify-logs/linuxX64/*.log" \
            --h2spec-manifest build/h2spec/variants.txt \
            --size 'klib:kuicksilver-*/build/classes/kotlin/*/main/klib/*' --size 'klib:kuicksilver-*/build/classes/kotlin/*/main/cinterop/kuicksilver-native-cinterop-ksl' --skip-module kuicksilver-testing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: '!cancelled()'
        with: { name: 'verify-linux-native-a${{ github.run_attempt }}', path: '${{ runner.temp }}/verify', if-no-files-found: error, retention-days: 30 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mingw-test-exe
          path: '*/build/bin/mingwX64/debugTest/test.exe'
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mingw-c-test-exe
          path: build/c-test/ksl_test.exe
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-arm64-test-kexe
          path: '*/build/bin/linuxArm64/debugTest/test.kexe'
          if-no-files-found: error
          retention-days: 7

  linux-native-arm64:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',linux-native-arm64,')) }}
    # The arm64 Kotlin/Native test executables linked by linux-native, run on a native arm64 runner in Ubuntu 24.04 (the K/N
    # arm64 sysroot needs glibc 2.25 > manylinux2014).
    needs: linux-native
    runs-on: ubuntu-24.04-arm
    permissions: { contents: read }
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: linux-arm64-test-kexe, path: . }
      - name: 'docker: test.kexe linux-arm64 (all modules)'
        # a hosted runner leaves a connect to TEST-NET-1 undecided: TcpSocketsNativeTest's test of that path may not skip
        # itself here (docs/process.md, "Hosted CI"); the owner's Docker sits behind a TUN that answers it, so not there
        env: { KSL_DOCKER_OPTS: '-e KSL_REQUIRE_UNDECIDED_CONNECT=1', KSL_KEXE_LOG_DIR: '${{ runner.temp }}/verify-logs/linuxArm64' }
        run: |
          . tools/ci/matrix.sh
          # shellcheck disable=SC2086   # the module list splits into arguments on purpose
          bash tools/ci/run-kexe.sh linux/arm64 "$KSL_UBUNTU_IMAGE" linuxArm64 $KSL_LINK_MODULES
      - name: 'verify: results for the documentation site (tools/docs/verify.py)'
        if: '!cancelled()'
        run: |
          python3 -I tools/docs/verify.py collect --lane linux-native-arm64 --host 'Linux arm64 (Ubuntu 24.04 container)' \
            --out "$RUNNER_TEMP/verify/linux-native-arm64.json" --gtest "linuxArm64:$RUNNER_TEMP/verify-logs/linuxArm64/*.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: '!cancelled()'
        with: { name: 'verify-linux-native-arm64-a${{ github.run_attempt }}', path: '${{ runner.temp }}/verify', if-no-files-found: error, retention-days: 30 }

  windows:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',windows,')) }}
    # Only runs the executables cross-built by linux-native (mingwX64 is Tier 3, built off Windows): the ksl C tests
    # (ksl_test.exe, ksl_udp_win.c among them) and every module's mingwX64 test.exe.
    needs: linux-native
    strategy:
      fail-fast: false
      matrix: { shard: [testing, others] }
    runs-on: windows-2025
    permissions: { contents: read }
    timeout-minutes: 60
    steps:
      # the C tests read their certificates and keys from kuicksilver-native/src/c/test/testdata, relative to the checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            kuicksilver-native/src/c/test/testdata
            tools/docs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: mingw-c-test-exe, path: ctest }
      - name: 'c-tests: mingw-x64 ksl_test.exe'
        if: matrix.shard == 'others'
        run: ./ctest/ksl_test.exe
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: mingw-test-exe, path: exe }
      - name: 'native: mingwX64 test.exe'
        shell: pwsh
        run: |
          # every module linked by linux-native (KSL_LINK_MODULES), split in two shards: kuicksilver-testing (its simulator
          # transfers take ~22 of the ~30 minutes) and the other seven; a module that failed keeps the others running
          $all = @(Get-ChildItem -Path exe -Recurse -Filter test.exe)
          if ($all.Count -lt 8) { Write-Host "::error::expected 8 test.exe, found $($all.Count)"; exit 1 }
          $sim = { $_.FullName -match '\\kuicksilver-testing\\' }
          $exes = if ('${{ matrix.shard }}' -eq 'testing') { @($all | Where-Object $sim) } else { @($all | Where-Object { -not (& $sim) }) }
          if ($exes.Count -lt 1) { Write-Host "::error::no test.exe in shard ${{ matrix.shard }}"; exit 1 }
          $failed = @()
          foreach ($e in $exes) {
            Write-Host "== $($e.FullName)"
            # the output also goes to build/verify-logs/mingwX64/<module>.log, for the documentation site (tools/docs/verify.py)
            $module = $e.FullName -replace '.*[\\/](kuicksilver-[^\\/]+)[\\/]build[\\/].*', '$1'
            New-Item -ItemType Directory -Force -Path build/verify-logs/mingwX64 | Out-Null
            & $e.FullName | Tee-Object -FilePath "build/verify-logs/mingwX64/$module.log"
            if ($LASTEXITCODE -ne 0) { $failed += $e.FullName }
          }
          if ($failed.Count -gt 0) { Write-Host "::error::test.exe failed: $($failed -join ', ')"; exit 1 }
      - name: 'verify: results for the documentation site (tools/docs/verify.py)'
        if: '!cancelled()'
        env: { SHARD: '${{ matrix.shard }}' }
        run: |
          python -I tools/docs/verify.py collect --lane "windows-$SHARD" --host 'Windows Server 2025' --out "$RUNNER_TEMP/verify/windows-$SHARD.json" \
            --gtest 'mingwX64:build/verify-logs/mingwX64/*.log'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: '!cancelled()'
        with: { name: 'verify-windows-${{ matrix.shard }}-a${{ github.run_attempt }}', path: '${{ runner.temp }}/verify', if-no-files-found: error, retention-days: 30 }

  windows-jvm:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',windows-jvm,')) }}
    # The JVM suites on a Windows host against the mingw-w64 JNI dll that openssl-docker built (the dll the jar ships). Nothing
    # native is built here: kuicksilver.openssl.prebuilt=true (also written by the setup action) keeps every opensslBuild* task
    # from running, and -x buildJniHost drops the only task that would shell out to tools/build-jni.sh (bash + a C toolchain +
    # OpenSSL for the host); the artifact is that script's output directory, so it lands where buildJniHost would have put it and
    # the loader checks it against its manifest.sha256 as usual. Platform differences are asserted per test, never by skipping a
    # suite: no POSIX file view (keylog and work-directory checks assert the Windows behaviour), USO/URO/ECN only where granted.
    needs: openssl-docker
    runs-on: windows-2025
    permissions: { contents: read }
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: jni-windows-x86_64, path: kuicksilver-native/build/jni }
      - name: 'jvm: module tests on Windows (CI-built dll)'
        run: |
          ls -l kuicksilver-native/build/jni/resources/META-INF/native
          $G --max-workers=2 --continue -Pkuicksilver.openssl.prebuilt=true -x :kuicksilver-native:buildJniHost \
            :kuicksilver-native:jvmTest :kuicksilver-tls:jvmTest :kuicksilver-quic:jvmTest :kuicksilver-http3:jvmTest \
            :kuicksilver-http2:jvmTest :kuicksilver-ktor-network:jvmTest :kuicksilver-ktor-client:jvmTest :kuicksilver-ktor-server:jvmTest
      - name: 'verify: results for the documentation site (tools/docs/verify.py)'
        if: '!cancelled()'
        run: |
          python -I tools/docs/verify.py collect --lane windows-jvm --host 'Windows Server 2025, JVM' --out "$RUNNER_TEMP/verify/windows-jvm.json" \
            --junit 'jvm:*/build/test-results/jvmTest/*.xml'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: '!cancelled()'
        with: { name: 'verify-windows-jvm-a${{ github.run_attempt }}', path: '${{ runner.temp }}/verify', if-no-files-found: error, retention-days: 30 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reports-windows-jvm
          path: '**/build/reports/tests/'
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # a test JVM out of heap leaves its heap dump there (the kuicksilver.test-jvm plugin)
        if: failure()
        with:
          name: 'heap-dumps-windows-jvm'
          path: '**/build/test-heap-dumps/'
          if-no-files-found: ignore
          retention-days: 7

  windows-loops-bench:
    # MultiLoopBenchmark (docs/benchmarks.md, "Several loops on one socket") on a Windows host: by hand only, and only when
    # `only` names it (never in the empty-`only` or scheduled runs, never a gate). Windows binds exclusively, so the loops
    # share one socket and its receiver; the JVM against the CI-built mingw-w64 dll, as in windows-jvm. The JMH report is the artifact.
    if: ${{ github.event_name == 'workflow_dispatch' && contains(format(',{0},', inputs.only), ',windows-loops-bench,') }}
    needs: openssl-docker
    runs-on: windows-2025
    permissions: { contents: read }
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: jni-windows-x86_64, path: kuicksilver-native/build/jni }
      - name: 'bench: loops on one socket (JVM, Windows)'
        run: $G --max-workers=2 -Pkuicksilver.openssl.prebuilt=true -x :kuicksilver-native:buildJniHost :kuicksilver-bench:jvmLoopsBenchmark
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: loops-bench-windows
          path: kuicksilver-bench/build/reports/benchmarks/
          if-no-files-found: warn
          retention-days: 30

  apple:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',apple,')) }}
    # macOS arm64: everything that needs Xcode or the host JVM on a Mac, in the order of tools/ci/local-matrix.sh. checkKotlinAbi
    # runs here because the klib dumps of every target need the Apple, Android (NDK) and Kotlin/Native toolchains together;
    # the only Docker-built input, mingw-x64 OpenSSL, comes from openssl-docker.
    needs: openssl-docker
    runs-on: xcode-27   # Xcode 27.0 (27A266a, gradle/toolchains.toml) is only on this preview image; macos-26 has 26.x
    permissions: { contents: read }
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { ndk: 'true', xcode: 'true', konan: 'linux_x64 linux_arm64 mingw_x64', openssl-cache: apple }
      - name: 'env: nothing that changes a native build is set'
        # the libraries built here are those a release reuses (tools/clean-build-env.sh, ksl_build_env_guard: the values the
        # setup action sets on purpose, the pinned NDK's LLVM tools, pass)
        run: |
          . tools/clean-build-env.sh
          set_vars=$(ksl_build_env_guard)
          [ -z "$set_vars" ] || { echo "::error::set on this runner: $set_vars (tools/clean-build-env.sh)"; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: openssl-mingw-x64, path: build/openssl/mingw-x64 }
      - name: 'check: spdx, layers, abi'
        run: |
          . tools/ci/matrix.sh
          # shellcheck disable=SC2086   # the list splits into Gradle task paths on purpose
          $G $KSL_CHECKS
      - name: 'quic/http3: architecture checks'
        run: |
          . tools/ci/matrix.sh
          # shellcheck disable=SC2086   # the list splits into Gradle task paths on purpose
          $G $KSL_ARCH_CHECKS
      - name: 'docs: API reference and site (Dokka, no warnings)'
        # the strict gate before a release: any undocumented public declaration or unresolved KDoc link fails here, not in
        # pages.yml after the tag (tools/docs/site.sh, tools/docs/api-baseline.properties)
        run: |
          python3 -m venv "$RUNNER_TEMP/docs-venv"
          "$RUNNER_TEMP/docs-venv/bin/pip" install --quiet --require-hashes -r tools/docs/requirements.txt
          # built as the development snapshot of this commit (links at the commit, the snapshot banner): a push run on main
          # uploads it below as site-dev, which pages.yml publishes as /dev/
          DOCS_PYTHON="$RUNNER_TEMP/docs-venv/bin/python" GRADLE_ARGS="--stacktrace" \
            bash tools/docs/site.sh 0.3.0-SNAPSHOT "$RUNNER_TEMP/site" --dev "$GITHUB_SHA" "$(git log -1 --format=%cI HEAD)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with: { name: site-dev, path: '${{ runner.temp }}/site/dev', if-no-files-found: error, retention-days: 7 }
      - name: 'openssl: no-sslkeylog (macos-arm64)'
        run: bash tools/check/keylog-disabled.sh build/openssl/macos-arm64/include
      - name: 'c-tests: macos-arm64 (ASan/UBSan)'
        run: bash tools/c-test.sh macos-arm64
      - name: 'jvm: all module tests'
        run: |
          . tools/ci/matrix.sh
          # shellcheck disable=SC2086   # the list splits into Gradle task paths on purpose
          $G --continue $KSL_JVM_TESTS
      - name: 'jvm: engine interop (Ktor engines, OkHttp, JDK, Netty)'
        # Kuicksilver's client and server engines against Ktor's Netty and CIO engines, OkHttp, the JDK's HttpClient and
        # Netty's HTTP/2 and HTTP/3 codecs, in one JVM over loopback (docs/spec/interop.md, "Engine interop")
        run: $G :kuicksilver-engine-interop:jvmTest
      - name: 'verify: results for the documentation site (tools/docs/verify.py)'
        if: '!cancelled()'
        run: |
          python3 -I tools/docs/verify.py collect --lane apple --host 'macOS arm64' --out "$RUNNER_TEMP/verify/apple.json" \
            --junit 'jvm:*/build/test-results/jvmTest/*.xml' --cases kuicksilver-engine-interop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: '!cancelled()'
        with: { name: 'verify-apple-a${{ github.run_attempt }}', path: '${{ runner.temp }}/verify', if-no-files-found: error, retention-days: 30 }
      - name: 'sample: realtime-telemetry'
        # its test classes are read for test methods no runner calls, as the modules' are below
        run: |
          (cd samples/realtime-telemetry && KSL_GRADLEW=../../gradlew bash ../../tools/ci/gradlew-retry.sh --stacktrace jvmTest)
          python3 -I tools/check/test-bytecode.py samples/realtime-telemetry/build/classes/kotlin/jvm/test
      - name: 'fuzz: regression corpus'
        run: . tools/ci/matrix.sh && $G "${KSL_FUZZ_ARGS[@]}"
      - name: 'sim: Monte-Carlo (KSL_SIM_RUNS=200)'
        run: . tools/ci/matrix.sh && $G "${KSL_SIM_ARGS[@]}"
      - name: 'bench: allocation gate'
        run: $G :kuicksilver-bench:jvmTest
      - name: 'jvm: every compiled test method can run'
        # the class files of the steps above (and soak's): a test method returning a value, static or private, or in an
        # abstract class nothing extends, is one no runner calls (tools/check/test-bytecode.py)
        run: $G :kuicksilver-soak:compileTestKotlinJvm && python3 -I tools/check/test-bytecode.py --targets jvm
      - name: 'jvm: exports whitelist (dylib)'
        run: |
          # shellcheck disable=SC2012   # library names are fixed ASCII
          bash tools/check/exports.sh "$(ls kuicksilver-native/build/jni/osx-aarch_64/libksl_*_osx_aarch_64.dylib | tail -1)" macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jni-osx-aarch_64
          path: kuicksilver-native/build/jni
          if-no-files-found: error
          retention-days: 7
      - name: 'jvm: JNI library osx-x86_64 (Intel Macs)'
        # the JVM on Intel Macs keeps its library although Kotlin/Native macosX64 was dropped (kuicksilver-native/openssl.gradle.kts)
        run: |
          $G :kuicksilver-native:opensslBuildMacosX64
          bash tools/check/keylog-disabled.sh build/openssl/macos-x64/include
          bash tools/build-jni.sh osx-x86_64 build/jni-osx-x86_64
          set -- build/jni-osx-x86_64/osx-x86_64/libksl_*_osx_x86_64.dylib
          [ "$(lipo -archs "$1")" = x86_64 ] || { echo "::error::$1 is $(lipo -archs "$1"), not x86_64"; exit 1; }
          bash tools/check/exports.sh "$1" macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jni-osx-x86_64
          path: build/jni-osx-x86_64
          if-no-files-found: error
          retention-days: 7
      - name: 'repro: double build (macos-arm64)'
        run: |
          bash tools/check/double-build.sh macos-arm64
          bash tools/check/native-flags-test.sh   # the builder's compiler and flags (docs/guide/building.md)
          bash tools/openssl/fetch-test.sh        # zlib and brotli verification (ADR-0025), on the tarballs fetched above
          bash tools/openssl/brotli-pin-check-test.sh   # the brotli pin-update check, against a local fixture repository
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reports-apple
          path: |
            **/build/reports/
            !**/*.hprof
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # a test JVM out of heap leaves its heap dump there (the kuicksilver.test-jvm plugin)
        if: failure()
        with:
          name: 'heap-dumps-apple'
          path: '**/build/test-heap-dumps/'
          if-no-files-found: ignore
          retention-days: 7

  apple-native:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',apple-native,')) }}
    # Kotlin/Native on Apple, beside the apple job instead of after it: the macOS and iOS-simulator suites took 43 of its
    # 65 minutes. The prefix whitelist runs last: it reads the ios-arm64 OpenSSL the device compile builds.
    needs: openssl-docker
    runs-on: xcode-27   # Xcode 27.0 (27A266a, gradle/toolchains.toml) is only on this preview image; macos-26 has 26.x
    permissions: { contents: read }
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { xcode: 'true', openssl-cache: apple-native }
      - name: 'native: macosArm64 tests'
        run: |
          . tools/ci/matrix.sh
          # shellcheck disable=SC2086   # the list splits into Gradle task paths on purpose
          $G $KSL_MACOS_TESTS
      - name: 'native: iosSimulatorArm64 tests'
        run: |
          . tools/ci/matrix.sh
          # shellcheck disable=SC2086   # the list splits into Gradle task paths on purpose
          $G $KSL_IOS_SIM_TESTS
      - name: 'native: compile iosArm64 (device)'
        id: ios-device
        run: |
          . tools/ci/matrix.sh
          # shellcheck disable=SC2086   # the list splits into Gradle task paths on purpose
          $G $KSL_IOS_COMPILE
      - name: 'native: prefix whitelist (apple)'
        run: |
          bash tools/prefix/check-no-unprefixed-test.sh   # its negative controls (unprefixed OpenSSL, zlib and brotli references)
          for t in macos-arm64 ios-arm64 ios-sim-arm64; do bash tools/prefix/check-no-unprefixed.sh build/openssl-prefixed/$t/lib || exit 1; done
      - name: 'native: Kuicksilver.xcframework (release, both slices; its size for the documentation site)'
        # the framework the Swift package ships (tools/release/xcframework.sh builds the release asset the same way)
        # with the flags of tools/release/xcframework.sh (-Pkuicksilver.version, no build cache), so the size is that of the
        # asset a release ships: the version is the release this commit prepares, the build's default without -SNAPSHOT
        run: |
          version=$(sed -n 's/^version = providers.gradleProperty("kuicksilver.version").getOrElse("\([^"]*\)")$/\1/p' build-logic/src/main/kotlin/kuicksilver.kmp.gradle.kts)
          version=${version%-SNAPSHOT}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "::error::no default version in build-logic/src/main/kotlin/kuicksilver.kmp.gradle.kts"; exit 1; }
          $G -p samples/ios --no-build-cache -Pkuicksilver.version="$version" -Pkuicksilver.openssl.prebuilt=true \
            :kuicksilver-swift:zipKuicksilverXCFramework
      - name: 'verify: results for the documentation site (tools/docs/verify.py)'
        if: '!cancelled()'
        env: { IOS_DEVICE: '${{ steps.ios-device.outcome }}' }
        run: |
          python3 -I tools/docs/verify.py collect --lane apple-native --host 'macOS arm64 (Xcode 27)' --out "$RUNNER_TEMP/verify/apple-native.json" \
            --junit 'macosArm64:*/build/test-results/macosArm64Test/*.xml' \
            --junit 'iosSimulatorArm64:*/build/test-results/iosSimulatorArm64Test/*.xml' \
            --compiled "iosArm64:$IOS_DEVICE" \
            --size 'xcframework:samples/ios/kuicksilver-swift/build/XCFrameworks/release/Kuicksilver.xcframework' \
            --size 'zip:samples/ios/kuicksilver-swift/build/spm/Kuicksilver.xcframework.zip' --size 'klib:kuicksilver-*/build/classes/kotlin/*/main/klib/*' --size 'klib:kuicksilver-*/build/classes/kotlin/*/main/cinterop/kuicksilver-native-cinterop-ksl' --skip-module kuicksilver-testing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: '!cancelled()'
        with: { name: 'verify-apple-native-a${{ github.run_attempt }}', path: '${{ runner.temp }}/verify', if-no-files-found: error, retention-days: 30 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reports-apple-native
          path: |
            **/build/reports/
            !**/*.hprof
          retention-days: 7

  android:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',android,')) }}
    # AAR with libksl.so for arm64-v8a, x86_64 and armeabi-v7a (pinned NDK), the size, 16 KiB page and consumer keep rule gates, then the device tests on the
    # x86_64 emulator at minSdk 24 and at compileSdk 35 (KVM on the Linux runner; Apple-silicon runners cannot nest it).
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    timeout-minutes: 120
    env:
      AAR: kuicksilver-native/build/outputs/aar/kuicksilver-native.aar
      SIZE_LIMIT: '3200000'   # +200,000 for zlib and brotli's decoder in libcrypto (RFC 8879 certificate compression, ADR-0025)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { ndk: 'true', openssl-cache: android }
      - name: 'android: AAR'
        run: $G :kuicksilver-native:bundleAndroidMainAar
      - name: 'android: every compiled host and device test method can run'
        # the Android host tests run under JUnit on the host JVM, the device tests under JUnit 4 on the emulator;
        # tools/check/test-bytecode.py reads their class files (the same classes for every API level: once)
        if: ${{ matrix.api == 35 }}
        run: |
          # shellcheck disable=SC2046   # one Gradle task path per module
          $G $(git ls-files 'kuicksilver-*/src/androidHostTest/*' | cut -d/ -f1 | sort -u | sed 's/.*/:&:compileAndroidHostTest/') \
            $(grep -l 'id("kuicksilver.kmp")' kuicksilver-*/build.gradle.kts | cut -d/ -f1 | sed 's/.*/:&:compileAndroidDeviceTest/')
          python3 -I tools/check/test-bytecode.py --targets android-host,android-device
      - name: 'android: size gate'
        run: bash tools/check/size.sh "$AAR" "$SIZE_LIMIT"
      - name: 'android: 16 KiB pages'
        run: bash tools/check/page-align.sh "$AAR"
      - name: 'android: consumer keep rules (R8)'
        run: bash tools/check/android-keep-rules.sh "$AAR"
        env: { KSL_R8_REQUIRED: '1' }   # R8 pinned in gradle/libs.versions.toml (ksR8Jar), android.jar with the SDK: the run and its negative control may not be skipped
      - name: 'jvm/android: service keep rules (R8)'
        run: |
          $G :kuicksilver-ktor-client:jvmJar :kuicksilver-ktor-client:bundleAndroidMainAar
          set -- kuicksilver-ktor-client/build/libs/kuicksilver-ktor-client-jvm-*.jar
          [ $# -eq 1 ] && [ -f "$1" ] || { echo "::error::expected one kuicksilver-ktor-client JVM jar, found: $*"; exit 1; }
          bash tools/check/service-keep-rules.sh "$1" kuicksilver-ktor-client/build/outputs/aar/kuicksilver-ktor-client.aar
        env: { KSL_R8_REQUIRED: '1' }
      - name: 'android: free disk for the emulator'
        # Run 38287900994: both emulators exited before adb saw them and the action only reported a boot timeout. The
        # OpenSSL work tree, three Android ABIs and the AAR fill the runner before the AVD's userdata partition is
        # created; the source tarball cache stays, the work tree and preinstalled toolchains this job never uses go.
        run: |
          df -h / | tail -1
          rm -rf build/openssl-work/build build/openssl-work/src/openssl-*/
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2[0-7]* /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: 'android: device tests (emulator)'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          # Runs 40636584799 and 40645584772: on API 24 a test APK of 11-14 MB failed in `pm install-write` (ddmlib
          # "Failed to install-write all apks"), once the first module's, once a later one's, while API 35 installed the same
          # APKs, and the APKs did not grow. The AVD created here sets no disk.dataPartition.size, so each level boots with
          # its system image's own userdata size; the API 24 one, the oldest image, is the suspect. 4 GiB for API 24; API 35
          # keeps its image's default (an empty disk-size leaves the AVD as it is).
          disk-size: ${{ matrix.api == 24 && '4096M' || '' }}
          # the action hides the emulator's own exit message; free space before the AVD is created is the first suspect
          pre-emulator-launch-script: df -h / | tail -1
          # a test APK whose install stalls (ddmlib "Failed to install-write all apks" with ShellCommandUnresponsiveException,
          # three runs on API 24) gets one more run, logged; any other failure fails at once (android-connected-check.sh).
          # the device's /data before the tests and, on failure, again with the logs: PackageManager's refusals are in the
          # system buffer, an instrumentation "Process crashed" in crash and main. Runs 2 of main c1cac36ca and b3e621916
          # (API 24, ServerH2FloodTest): ART's abort dump for "Tried to mark 0xebadde09" was cut by logd's pruning of the
          # chattiest uid ("chatty ... expire 750 lines") on the default 256 KiB buffers, and with it the "Found invalid
          # root ... vreg=" line that names the frame; 16 MiB per buffer keeps a whole dump.
          script: |
            adb logcat -G 16M || true
            adb shell df /data || true
            bash tools/ci/android-connected-check.sh || { mkdir -p build/reports && adb shell df /data > build/reports/df.txt; adb logcat -d -b crash -b main -b system > build/reports/logcat.txt; exit 1; }
      - name: 'verify: results for the documentation site (tools/docs/verify.py)'
        if: '!cancelled()'
        env: { API: '${{ matrix.api }}' }
        run: |
          sizes=(); [ "$API" != 35 ] || sizes=(--size "aar:$AAR")
          python3 -I tools/docs/verify.py collect --lane "android-$API" --host "Android API $API (x86_64 emulator)" --out "$RUNNER_TEMP/verify/android-$API.json" \
            --junit 'android:*/build/outputs/androidTest-results/connected/**/*.xml' "${sizes[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: '!cancelled()'
        with: { name: 'verify-android-${{ matrix.api }}-a${{ github.run_attempt }}', path: '${{ runner.temp }}/verify', if-no-files-found: error, retention-days: 30 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: 'reports-android-${{ matrix.api }}'
          path: |
            **/build/reports/
            !**/*.hprof
          retention-days: 7

  jdk-compat:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',jdk-compat,')) }}
    # Review I7: the libraries promise JVM 17. Compiled against the JDK 17 API (-Xjdk-release=17, always on in kuicksilver.kmp),
    # every JVM suite runs on Temurin 17; on JDK 25 the same suites run with restricted native access denied unless the
    # application enables it (JEP 472) — the library must never need more than --enable-native-access.
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        jdk: [17, 25]
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: testjdk
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '${{ matrix.jdk }}'
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: jni-linux-x86_64, path: kuicksilver-native/build/jni }
      # the headers buildTestHooksJni compiles the kuicksilver-tls test hooks against, reused (kuicksilver.openssl.prebuilt) rather
      # than built here in Docker
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: openssl-linux-x64, path: build/openssl/linux-x64 }
      - name: 'jvm: all module tests on JDK ${{ matrix.jdk }} (JDK 17 API)'
        env:
          TEST_JDK: ${{ steps.testjdk.outputs.path }}
          TEST_JVM_ARGS: ${{ matrix.jdk == 25 && '--illegal-native-access=deny --enable-native-access=ALL-UNNAMED' || '' }}
        run: |
          . tools/ci/matrix.sh
          # shellcheck disable=SC2086
          $G --continue -x :kuicksilver-native:buildJniHost -Pkuicksilver.test.jdk=${{ matrix.jdk }} \
            "-Porg.gradle.java.installations.paths=$TEST_JDK" ${TEST_JVM_ARGS:+"-Pkuicksilver.test.jvmArgs=$TEST_JVM_ARGS"} $KSL_JVM_TESTS
      - name: 'verify: results for the documentation site (tools/docs/verify.py)'
        if: '!cancelled()'
        env: { JDK: '${{ matrix.jdk }}' }
        run: |
          python3 -I tools/docs/verify.py collect --lane "jdk-$JDK" --host "Linux x64 (JDK $JDK)" --out "$RUNNER_TEMP/verify/jdk-$JDK.json" \
            --junit 'jvm:*/build/test-results/jvmTest/*.xml'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: '!cancelled()'
        with: { name: 'verify-jdk-${{ matrix.jdk }}-a${{ github.run_attempt }}', path: '${{ runner.temp }}/verify', if-no-files-found: error, retention-days: 30 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: 'reports-jdk-${{ matrix.jdk }}'
          path: '**/build/reports/tests/'
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # a test JVM out of heap leaves its heap dump there (the kuicksilver.test-jvm plugin)
        if: failure()
        with:
          name: 'heap-dumps-jdk-${{ matrix.jdk }}'
          path: '**/build/test-heap-dumps/'
          if-no-files-found: ignore
          retention-days: 7

  interop-images:
    # Both interop endpoint images: JVM (kuicksilver-interop:local, with the manylinux libksl.so from the linux job)
    # and Kotlin/Native (kuicksilver-interop-native:local), built once and handed to the per-peer jobs.
    if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.interop)) && (inputs.only == '' || contains(format(',{0},', inputs.only), ',interop-images,'))
    needs: [openssl-docker, linux]
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { ndk: 'true', konan: 'linux_x64 linux_arm64', openssl-cache: interop }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: openssl-linux-x64, path: build/openssl/linux-x64 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: jni-linux-x86_64, path: kuicksilver-native/build/jni }
      - name: 'docker: image linux-x64'   # build-image.sh builds the .so in it when the artifact lacks the current ABI
        run: bash tools/openssl/build-docker.sh --image linux-x64
      - name: 'interop: jvm image'
        run: bash tools/interop/build-image.sh
      - name: 'interop: native image'
        run: bash tools/interop/build-image.sh --native
      - name: Save images
        run: docker save kuicksilver-interop:local kuicksilver-interop-native:local | gzip -1 > interop-images.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: interop-images, path: interop-images.tar.gz, if-no-files-found: error, retention-days: 3, compression-level: 0 }

  interop:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',interop,')) }}
    # The QUIC Interop Runner (pinned in tools/interop/runner.lock) with kuicksilver as server and as client against each peer;
    # --check-required fails on any cell of tools/interop/required.json in this run's scope (its image, peer and cases).
    needs: interop-images
    strategy:
      fail-fast: false
      matrix:
        image: [jvm, native]
        peer: [quic-go, ngtcp2, quiche, picoquic, quinn, msquic]   # = KSL_INTEROP_PEERS in tools/ci/matrix.sh
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: interop-images }
      - name: Docker Engine from Docker's repository   # the runner's compose file sets interface_name (Docker Engine 28.1 or later)
        run: bash tools/ci/interop-host.sh docker   # key by fingerprint, docker-ce of a pinned series
      - name: Load images
        run: gunzip -c interop-images.tar.gz | docker load && rm interop-images.tar.gz
      - name: Runner prerequisites
        run: |
          bash tools/ci/interop-host.sh tshark   # the runner needs tshark 4.5 or later (its README); Ubuntu 24.04 ships 4.2
          sudo modprobe ip6table_filter   # the simulator's IPv6 network
      - name: 'interop: ${{ matrix.image }} image vs ${{ matrix.peer }}, required cells'
        env:
          IMAGE: ${{ matrix.image }}
          PEER: ${{ matrix.peer }}
        run: |
          . tools/ci/matrix.sh
          case " $KSL_INTEROP_PEERS " in *" $PEER "*) ;; *) echo "::error::$PEER is not in KSL_INTEROP_PEERS (tools/ci/matrix.sh)"; exit 1 ;; esac
          if [ "$IMAGE" = native ]; then
            bash tools/interop/run-local.sh --check-required --image native -t "$KSL_INTEROP_NATIVE_CASES" "$PEER"
          else
            bash tools/interop/run-local.sh --check-required -t "$KSL_INTEROP_CASES" "$PEER"
          fi
      - name: 'verify: results for the documentation site (tools/docs/verify.py)'
        if: '!cancelled()'
        env: { IMAGE: '${{ matrix.image }}', PEER: '${{ matrix.peer }}' }
        run: |
          python3 -I tools/docs/verify.py collect --lane "interop-$IMAGE-$PEER" --host 'Linux x64 (QUIC Interop Runner)' \
            --out "$RUNNER_TEMP/verify/interop-$IMAGE-$PEER.json" --interop-runner "$IMAGE:build/interop/2*/*.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: '!cancelled()'
        with: { name: 'verify-interop-${{ matrix.image }}-${{ matrix.peer }}-a${{ github.run_attempt }}', path: '${{ runner.temp }}/verify', if-no-files-found: error, retention-days: 30 }
      - name: 'interop: handshake with the runner debug log'   # what docker compose said when a cell or the compliance check failed
        if: failure()
        env:
          IMAGE: ${{ matrix.image }}
          PEER: ${{ matrix.peer }}
        run: |
          docker version --format 'engine {{.Server.Version}}'; docker compose version; docker images --format '{{.Repository}}:{{.Tag}}'
          # its results stay out of the uploaded build/interop/2* (they are not this job's verdict), and no ENVIRONMENT reruns
          KSL_INTEROP_DEBUG=1 KSL_INTEROP_ENV_RERUNS=0 bash tools/interop/run-local.sh --out build/interop-debug/handshake \
            --image "$IMAGE" -t handshake "$PEER" 2>&1 | tail -300 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: 'interop-${{ matrix.image }}-${{ matrix.peer }}'
          path: build/interop/2*
          retention-days: 14

  openssl-next:
    # OpenSSL 4.x readiness, never a gate: the newest 4.x release of gradle/openssl-next.toml (version, tarball SHA-256 and signing
    # key pinned like the 3.5 one, same fetch.sh and build.sh through KSL_OPENSSL_PIN) is built on the runner itself, the ksl C
    # tests run against it, and a JVM smoke test loads the JNI library built from it. continue-on-error: a red step here shows in
    # the log, not in the run's result; no job depends on it and no artifact leaves it but a failed step's test reports and heap
    # dumps (release artifacts are 3.5 only). Not in push or pull_request runs: the weekly run, or a dispatch whose `only`
    # names it.
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && contains(format(',{0},', inputs.only), ',openssl-next,')) }}
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    permissions: { contents: read }
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: macos-26, target: macos-arm64 }
    env:
      KSL_OPENSSL_PIN: gradle/openssl-next.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { openssl-cache: next, pin: gradle/openssl-next.toml }
      - name: 'openssl-next: fetch and verify'
        run: bash tools/openssl/fetch.sh
      - name: 'openssl-next: build ${{ matrix.target }}'
        run: JOBS=3 bash tools/openssl/build.sh ${{ matrix.target }}
      - name: 'openssl-next: C tests (${{ matrix.target }})'
        run: bash tools/c-test.sh ${{ matrix.target }}
      - name: 'openssl-next: JVM smoke test (${{ matrix.target }})'
        # the bindings load the JNI library built from the 4.x archives and a TLS handshake runs through it
        run: |
          $G --max-workers=2 -Pkuicksilver.openssl.prebuilt=true -Pkuicksilver.openssl.pin=gradle/openssl-next.toml \
            :kuicksilver-native:jvmTest \
            --tests 'io.kuicksilver.native.KslSmokeTest.versionStringNamesTheKslAbi' \
            --tests 'io.kuicksilver.native.KslSmokeTest.abiVersionMatches' \
            --tests 'io.kuicksilver.native.KslSmokeTest.ctxFreezeRejectsMutation' \
            :kuicksilver-tls:jvmTest --tests 'io.kuicksilver.tls.TlsConnectionTest'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: 'reports-openssl-next-${{ matrix.target }}'
          path: '**/build/reports/tests/'
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # a test JVM out of heap leaves its heap dump there (the kuicksilver.test-jvm plugin)
        if: failure()
        with:
          name: 'heap-dumps-openssl-next-${{ matrix.target }}'
          path: '**/build/test-heap-dumps/'
          if-no-files-found: ignore
          retention-days: 7

  jvm-jar:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',jvm-jar,')) }}
    # The kuicksilver-native JVM jar as it is published: libksl for every JVM platform, each library built (and, except the
    # Windows dll and the Intel-Mac dylib, tested) by its own job and checked against that job's manifest.sha256.
    # buildJniHost is excluded: on this runner it would replace the manylinux .so with a host-gcc build.
    needs: [openssl-docker, linux, apple]
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: 'jni-*', path: build/jni-artifacts }
      - name: 'jvm: collect JNI libraries'
        run: bash tools/ci/collect-jni.sh build/jni-artifacts
      - name: 'jvm: jar with every JNI library'
        run: |
          $G --max-workers=2 -Pkuicksilver.openssl.prebuilt=true -x :kuicksilver-native:buildJniHost :kuicksilver-native:jvmJar
          set -- kuicksilver-native/build/libs/kuicksilver-native-jvm-*.jar
          unzip -l "$1" 'META-INF/native/*'
          bash tools/ci/collect-jni.sh --check-jar "$1"
      - name: 'verify: results for the documentation site (tools/docs/verify.py)'
        if: '!cancelled()'
        run: |
          python3 -I tools/docs/verify.py collect --lane jvm-jar --host 'Linux x64' --out "$RUNNER_TEMP/verify/jvm-jar.json" \
            --size 'jni:kuicksilver-native/build/jni/resources/META-INF/native/libksl_*' --size 'jar:kuicksilver-native/build/libs/kuicksilver-native-jvm-*.jar'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: '!cancelled()'
        with: { name: 'verify-jvm-jar-a${{ github.run_attempt }}', path: '${{ runner.temp }}/verify', if-no-files-found: error, retention-days: 30 }

  consumer-smoke:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',consumer-smoke,')) }}
    # The published artifacts consumed the way a user does: publishToMavenLocal (unsigned, the jar with all five JNI
    # libraries), then samples/realtime-telemetry built from mavenLocal() without includeBuild (tools/check/consumer-smoke.sh).
    needs: [openssl-docker, jvm-jar]
    runs-on: xcode-27   # Xcode 27.0 (27A266a, gradle/toolchains.toml) is only on this preview image; macos-26 has 26.x
    permissions: { contents: read }
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { ndk: 'true', xcode: 'true', konan: 'linux_x64 linux_arm64 mingw_x64', openssl-cache: apple }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: openssl-mingw-x64, path: build/openssl/mingw-x64 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: 'jni-*', path: build/jni-artifacts }
      - name: 'jvm: collect JNI libraries'
        run: bash tools/ci/collect-jni.sh build/jni-artifacts
      - name: 'publish: mavenLocal'
        run: $G --max-workers=2 -Pkuicksilver.sign=false -x :kuicksilver-native:buildJniHost publishToMavenLocal
      - name: 'sample: realtime-telemetry from mavenLocal'
        run: bash tools/check/consumer-smoke.sh
