# CI matrix. The same steps as tools/ci/local-matrix.sh, which runs them on the owner's macOS host: both take the
# module and interop case lists from tools/ci/matrix.sh, and step names match so a red step maps to a local one.
# Written to pass on fresh GitHub-hosted runners; to be confirmed by the first run after the repository goes public.
#
#   lint ──────────────────────────────────────────────── pins, SPDX, script syntax
#   openssl-docker (linux-x64, linux-arm64, mingw-x64 + the Windows JNI dll) ─┬─ linux (x64, arm64): manylinux C tests, .so, JVM suites, system OpenSSL
#                                                        ├─ linux-native: -kn OpenSSL, test.kexe x64 + arm64, mingw test.exe + ksl_test.exe ── windows
#                                                        ├─ apple (macOS arm64): ABI dumps, ASan C tests, JVM + macosArm64 suites, Intel-Mac dylib, repro
#                                                        └─ interop-images ── interop (weekly / dispatch): JVM and native image × 6 peers
#   openssl-docker ── windows-jvm (windows-2025): the JVM suites against the mingw-w64 JNI dll
#   openssl-docker + linux + apple ── jvm-jar: the kuicksilver-native jar with all five JNI libraries ── consumer-smoke (mavenLocal)
#   JNI artifacts jni-<classifier> (tools/build-jni.sh output dirs; .github/workflows/release.yml reuses them from the green run):
#     linux-x86_64, linux-aarch_64 ← linux · osx-aarch_64, osx-x86_64 ← apple · windows-x86_64 ← openssl-docker (mingw-x64)
#   android (API 24, 35): AAR (arm64-v8a, x86_64, armeabi-v7a), size and 16 KiB gates, emulator tests
#   linux ── jdk-compat (JDK 17 API, tests on 17 / 25)
name: build
on:
  # push, pull_request and the weekly schedule come back once the matrix is green on the public runners again (2026-10-26)
  workflow_dispatch:
    inputs:
      only:
        description: comma-separated jobs to run (e.g. lint,apple); empty runs all; openssl-docker always runs
        type: string
        default: ''
      interop:
        description: also run the QUIC Interop Runner matrix (hours)
        type: boolean
        default: false
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
env:
  G: ./gradlew --stacktrace

jobs:
  lint:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',lint,')) }}
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: 'lint: action/image pins'
        run: bash tools/check/pins.sh .
      - name: 'lint: documentation references'
        run: bash tools/check/doc-refs.sh
      - name: 'lint: doc-refs negative controls'
        run: bash tools/check/doc-refs-test.sh
      - name: 'lint: links (Markdown, llms.txt)'
        run: bash tools/check/links.sh
      - name: 'lint: SPDX headers'
        run: bash tools/check/spdx.sh .
      - name: 'lint: shell syntax'
        run: |
          rc=0; while IFS= read -r f; do bash -n "$f" || rc=1; done < <(git ls-files '*.sh'); exit $rc
      - name: 'lint: shellcheck (errors)'
        run: git ls-files '*.sh' | xargs shellcheck -S error
      - uses: ./.github/actions/setup
      - name: 'lint: ktlint'
        # kotlinter's lintKotlin only parses sources: no Kotlin/Native toolchain, OpenSSL or NDK is needed
        run: ./gradlew --max-workers=2 lintKotlin
      - name: 'check: dependency verification (every configuration)'
        # resolves every configuration of every project with verification on: an artifact gradle/verification-metadata.xml does
        # not cover fails here, not in the one late job that happens to resolve it (CONTRIBUTING.md, "Dependency verification")
        run: ./gradlew --max-workers=2 -I tools/check/resolve-all.init.gradle.kts -Pkuicksilver.resolveAll.strict=true --continue :build-logic:ksResolveAll ksResolveAll

  openssl-docker:
    # The container-built OpenSSL targets, shared with the other jobs as artifacts (they reuse them through
    # kuicksilver.openssl.prebuilt=true, set by .github/actions/setup). The -kn targets are built on the host with the
    # Kotlin/Native clang (tools/openssl/build.sh) by the jobs that need them, never here.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: mingw-x64, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    permissions: { contents: read }
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/openssl-work/cache
            build/openssl-work/src/*.tar.gz
            build/openssl-work/src/*.tar.gz.asc
          key: openssl-docker-${{ matrix.target }}-${{ runner.arch }}-${{ hashFiles('gradle/openssl.toml', 'tools/openssl/**') }}
      - name: 'openssl: fetch and verify'
        run: bash tools/openssl/fetch.sh
      - name: 'openssl: build ${{ matrix.target }}'
        run: bash tools/openssl/build-docker.sh ${{ matrix.target }}
      - name: 'openssl: no-sslkeylog (${{ matrix.target }})'
        run: bash tools/check/keylog-disabled.sh build/openssl/${{ matrix.target }}/include
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openssl-${{ matrix.target }}
          path: build/openssl/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7
      - name: 'docker: JNI library windows-x86_64 (mingw)'
        if: matrix.target == 'mingw-x64'
        run: bash tools/ci/jni-windows.sh build/jni-windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.target == 'mingw-x64'
        with:
          name: jni-windows-x86_64
          path: build/jni-windows
          if-no-files-found: error
          retention-days: 7

  linux:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',linux,')) }}
    # Linux JVM path end to end in the manylinux2014 images (glibc 2.17 floor): C tests, libksl.so, its exports and glibc floor,
    # then every module's JVM suite on the host JVM against that .so (tools/ci/docker-jvm.sh). arm64 runs on an arm64 runner
    # (native first, qemu-user only as a fallback — it lacks io_uring and parts of the UDP socket options).
    needs: openssl-docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: ubuntu-24.04, target: linux-x64, classifier: linux-x86_64, platform: linux/amd64 }
          - { arch: arm64, os: ubuntu-24.04-arm, target: linux-arm64, classifier: linux-aarch_64, platform: linux/arm64 }
    runs-on: ${{ matrix.os }}
    permissions: { contents: read }
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: 'openssl-${{ matrix.target }}'
          path: 'build/openssl/${{ matrix.target }}'
      - name: LLVM binutils for the checks
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends llvm
      - name: 'docker: image ${{ matrix.target }}'
        run: bash tools/openssl/build-docker.sh --image ${{ matrix.target }}
      # the ICMP error-queue tests (udp_recverr_*) run in a user and network namespace: Ubuntu 24.04 restricts unprivileged user
      # namespaces through AppArmor and Docker's default seccomp profile refuses unshare(CLONE_NEWUSER), so both are lifted for this
      # container, and the step fails when the tests still skipped (as tools/ci/local-matrix.sh's docker_ctests)
      - name: 'host: allow unprivileged user namespaces'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: 'docker: c-tests ${{ matrix.target }}'
        env: { KSL_DOCKER_OPTS: '--security-opt seccomp=unconfined' }
        run: |
          rc=0; out=$(bash tools/ci/docker-run.sh ${{ matrix.platform }} kuicksilver-openssl-${{ matrix.target }} "CC=/opt/rh/devtoolset-10/root/usr/bin/gcc SAN= bash tools/c-test.sh ${{ matrix.target }}" 2>&1) || rc=$?   # the shell runs with -e
          printf '%s\n' "$out"
          [ "$rc" = 0 ] || exit "$rc"
          grep -q 'udp_recverr_ptb_parsed: OK' <<< "$out" || { echo "udp_recverr_ptb_parsed did not run (SKIP)"; exit 1; }
      - name: 'docker: jvm ${{ matrix.target }} (.so + tests)'
        run: bash tools/ci/docker-jvm.sh ${{ matrix.classifier }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jni-${{ matrix.classifier }}
          path: kuicksilver-native/build/jni
          if-no-files-found: error
          retention-days: 7
      - name: 'docker: system OpenSSL mode'
        if: matrix.arch == 'x64'
        run: bash tools/ci/system-openssl.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: 'reports-linux-${{ matrix.arch }}'
          path: '**/build/reports/tests/'
          retention-days: 7

  linux-native:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',linux-native,')) }}
    # Kotlin/Native for Linux and Windows: the -kn OpenSSL builds with the konan clang and sysroots, the prefixed archives, the
    # test executables; test.kexe x64 runs in the manylinux image, the arm64 ones go to linux-native-arm64 (a native arm64
    # runner: under QEMU the real-time suites ran 10-50x slower and timed out, run 38287900994), the mingw test.exe to windows.
    needs: openssl-docker
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { ndk: 'true', konan: 'linux_x64 linux_arm64 mingw_x64', openssl-cache: linux-native }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: openssl-mingw-x64, path: build/openssl/mingw-x64 }
      - name: 'native: link linux/mingw tests'
        run: |
          . tools/ci/matrix.sh
          # shellcheck disable=SC2046,SC2086   # the lists split into Gradle task paths on purpose
          $G $(ksl_tasks linkDebugTestLinuxX64 $KSL_LINK_MODULES) $(ksl_tasks linkDebugTestLinuxArm64 $KSL_LINK_MODULES) $(ksl_tasks linkDebugTestMingwX64 $KSL_LINK_MODULES)
      - name: 'c-tests: mingw-x64 (cross-built, -Werror; run by windows)'
        # the ksl C tests (test_udp_win.c among them) with the Kotlin/Native llvm + mingw sysroot the link step fetched;
        # only system DLLs are imported, so the exe runs as is on the windows runner
        run: bash tools/c-test.sh mingw-x64
      - name: 'native: glibc floors'
        run: bash tools/check/glibc-floor.sh kuicksilver-native/build/bin/linuxX64/debugTest/test.kexe 2.19 && bash tools/check/glibc-floor.sh kuicksilver-native/build/bin/linuxArm64/debugTest/test.kexe 2.25
      - name: 'native: prefix whitelist (linux/mingw)'
        run: for t in linux-x64-kn linux-arm64-kn mingw-x64; do bash tools/prefix/check-no-unprefixed.sh build/openssl-prefixed/$t/lib || exit 1; done
      - name: 'docker: image linux-x64'
        run: bash tools/openssl/build-docker.sh --image linux-x64
      - name: 'docker: test.kexe linux-x64 (all modules)'
        run: |
          . tools/ci/matrix.sh
          # shellcheck disable=SC2086   # the module list splits into arguments on purpose
          bash tools/ci/run-kexe.sh linux/amd64 kuicksilver-openssl-linux-x64 linuxX64 $KSL_LINK_MODULES
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mingw-test-exe
          path: '*/build/bin/mingwX64/debugTest/test.exe'
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mingw-c-test-exe
          path: build/c-test/ksl_test.exe
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-arm64-test-kexe
          path: '*/build/bin/linuxArm64/debugTest/test.kexe'
          if-no-files-found: error
          retention-days: 7

  linux-native-arm64:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',linux-native-arm64,')) }}
    # The arm64 Kotlin/Native test executables linked by linux-native, run on a native arm64 runner in Ubuntu 24.04 (the K/N
    # arm64 sysroot needs glibc 2.25 > manylinux2014).
    needs: linux-native
    runs-on: ubuntu-24.04-arm
    permissions: { contents: read }
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: linux-arm64-test-kexe, path: . }
      - name: 'docker: test.kexe linux-arm64 (all modules)'
        run: |
          . tools/ci/matrix.sh
          # shellcheck disable=SC2086   # the module list splits into arguments on purpose
          bash tools/ci/run-kexe.sh linux/arm64 "$KSL_UBUNTU_IMAGE" linuxArm64 $KSL_LINK_MODULES

  windows:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',windows,')) }}
    # Only runs the executables cross-built by linux-native (mingwX64 is Tier 3, built off Windows): the ksl C tests
    # (ksl_test.exe, ksl_udp_win.c among them) and every module's mingwX64 test.exe.
    needs: linux-native
    runs-on: windows-2025
    permissions: { contents: read }
    timeout-minutes: 60
    steps:
      # the C tests read their certificates and keys from kuicksilver-native/src/c/test/testdata, relative to the checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, sparse-checkout: kuicksilver-native/src/c/test/testdata }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: mingw-c-test-exe, path: ctest }
      - name: 'c-tests: mingw-x64 ksl_test.exe'
        run: ./ctest/ksl_test.exe
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: mingw-test-exe, path: exe }
      - name: 'native: mingwX64 test.exe'
        shell: pwsh
        run: |
          # every module linked by linux-native (KSL_LINK_MODULES); a module that failed keeps the others running
          $exes = @(Get-ChildItem -Path exe -Recurse -Filter test.exe)
          if ($exes.Count -lt 8) { Write-Host "::error::expected 8 test.exe, found $($exes.Count)"; exit 1 }
          $failed = @()
          foreach ($e in $exes) {
            Write-Host "== $($e.FullName)"
            & $e.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $e.FullName }
          }
          if ($failed.Count -gt 0) { Write-Host "::error::test.exe failed: $($failed -join ', ')"; exit 1 }

  windows-jvm:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',windows-jvm,')) }}
    # The JVM suites on a Windows host against the mingw-w64 JNI dll that openssl-docker built (the dll the jar ships). Nothing
    # native is built here: kuicksilver.openssl.prebuilt=true (also written by the setup action) keeps every opensslBuild* task
    # from running, and -x buildJniHost drops the only task that would shell out to tools/build-jni.sh (bash + a C toolchain +
    # OpenSSL for the host); the artifact is that script's output directory, so it lands where buildJniHost would have put it and
    # the loader checks it against its manifest.sha256 as usual. Platform differences are asserted per test, never by skipping a
    # suite: no POSIX file view (keylog and work-directory checks assert the Windows behaviour), USO/URO/ECN only where granted.
    needs: openssl-docker
    runs-on: windows-2025
    permissions: { contents: read }
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: jni-windows-x86_64, path: kuicksilver-native/build/jni }
      - name: 'jvm: module tests on Windows (CI-built dll)'
        run: |
          ls -l kuicksilver-native/build/jni/resources/META-INF/native
          $G --max-workers=2 --continue -Pkuicksilver.openssl.prebuilt=true -x :kuicksilver-native:buildJniHost \
            :kuicksilver-native:jvmTest :kuicksilver-tls:jvmTest :kuicksilver-quic:jvmTest :kuicksilver-http3:jvmTest \
            :kuicksilver-ktor-network:jvmTest :kuicksilver-ktor-client:jvmTest :kuicksilver-ktor-server:jvmTest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reports-windows-jvm
          path: '**/build/reports/tests/'
          retention-days: 7

  apple:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',apple,')) }}
    # macOS arm64: everything that needs Xcode or the host JVM on a Mac, in the order of tools/ci/local-matrix.sh. checkKotlinAbi
    # runs here because the klib dumps of every target need the Apple, Android (NDK) and Kotlin/Native toolchains together;
    # the only Docker-built input, mingw-x64 OpenSSL, comes from openssl-docker.
    needs: openssl-docker
    runs-on: xcode-27   # Xcode 27.0 (27A266a, gradle/toolchains.toml) is only on this preview image; macos-26 has 26.x
    permissions: { contents: read }
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { ndk: 'true', xcode: 'true', konan: 'linux_x64 linux_arm64 mingw_x64', openssl-cache: apple }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: openssl-mingw-x64, path: build/openssl/mingw-x64 }
      - name: 'check: spdx, layers, abi'
        run: |
          . tools/ci/matrix.sh
          # shellcheck disable=SC2086   # the list splits into Gradle task paths on purpose
          $G $KSL_CHECKS
      - name: 'quic/http3: architecture checks'
        run: |
          . tools/ci/matrix.sh
          # shellcheck disable=SC2086   # the list splits into Gradle task paths on purpose
          $G $KSL_ARCH_CHECKS
      - name: 'openssl: no-sslkeylog (macos-arm64)'
        run: bash tools/check/keylog-disabled.sh build/openssl/macos-arm64/include
      - name: 'c-tests: macos-arm64 (ASan/UBSan)'
        run: bash tools/c-test.sh macos-arm64
      - name: 'jvm: all module tests'
        run: |
          . tools/ci/matrix.sh
          # shellcheck disable=SC2086   # the list splits into Gradle task paths on purpose
          $G --continue $KSL_JVM_TESTS
      - name: 'sample: realtime-telemetry'
        run: cd samples/realtime-telemetry && ../../gradlew --stacktrace jvmTest
      - name: 'fuzz: regression corpus'
        run: . tools/ci/matrix.sh && $G "${KSL_FUZZ_ARGS[@]}"
      - name: 'sim: Monte-Carlo (KSL_SIM_RUNS=200)'
        run: . tools/ci/matrix.sh && $G "${KSL_SIM_ARGS[@]}"
      - name: 'bench: allocation gate'
        run: $G :kuicksilver-bench:jvmTest
      - name: 'jvm: exports whitelist (dylib)'
        run: |
          # shellcheck disable=SC2012   # library names are fixed ASCII
          bash tools/check/exports.sh "$(ls kuicksilver-native/build/jni/osx-aarch_64/libksl_*_osx_aarch_64.dylib | tail -1)" macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jni-osx-aarch_64
          path: kuicksilver-native/build/jni
          if-no-files-found: error
          retention-days: 7
      - name: 'jvm: JNI library osx-x86_64 (Intel Macs)'
        # the JVM on Intel Macs keeps its library although Kotlin/Native macosX64 was dropped (kuicksilver-native/openssl.gradle.kts)
        run: |
          $G :kuicksilver-native:opensslBuildMacosX64
          bash tools/check/keylog-disabled.sh build/openssl/macos-x64/include
          bash tools/build-jni.sh osx-x86_64 build/jni-osx-x86_64
          set -- build/jni-osx-x86_64/osx-x86_64/libksl_*_osx_x86_64.dylib
          [ "$(lipo -archs "$1")" = x86_64 ] || { echo "::error::$1 is $(lipo -archs "$1"), not x86_64"; exit 1; }
          bash tools/check/exports.sh "$1" macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jni-osx-x86_64
          path: build/jni-osx-x86_64
          if-no-files-found: error
          retention-days: 7
      - name: 'native: macosArm64 tests'
        run: |
          . tools/ci/matrix.sh
          # shellcheck disable=SC2086   # the list splits into Gradle task paths on purpose
          $G $KSL_MACOS_TESTS
      - name: 'native: prefix whitelist (apple)'
        run: for t in macos-arm64 ios-arm64 ios-sim-arm64; do bash tools/prefix/check-no-unprefixed.sh build/openssl-prefixed/$t/lib || exit 1; done
      - name: 'native: iosSimulatorArm64 tests'
        run: |
          . tools/ci/matrix.sh
          # shellcheck disable=SC2086   # the list splits into Gradle task paths on purpose
          $G $KSL_IOS_SIM_TESTS
      - name: 'native: compile iosArm64 (device)'
        run: |
          . tools/ci/matrix.sh
          # shellcheck disable=SC2086   # the list splits into Gradle task paths on purpose
          $G $KSL_IOS_COMPILE
      - name: 'repro: double build (macos-arm64)'
        run: bash tools/check/double-build.sh macos-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with: { name: reports-apple, path: '**/build/reports/', retention-days: 7 }

  android:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',android,')) }}
    # AAR with libksl.so for arm64-v8a, x86_64 and armeabi-v7a (pinned NDK), the size, 16 KiB page and consumer keep rule gates, then the device tests on the
    # x86_64 emulator at minSdk 24 and at compileSdk 35 (KVM on the Linux runner; Apple-silicon runners cannot nest it).
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    timeout-minutes: 120
    env:
      AAR: kuicksilver-native/build/outputs/aar/kuicksilver-native.aar
      SIZE_LIMIT: '3000000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { ndk: 'true', openssl-cache: android }
      - name: 'android: AAR'
        run: $G :kuicksilver-native:bundleAndroidMainAar
      - name: 'android: size gate'
        run: bash tools/check/size.sh "$AAR" "$SIZE_LIMIT"
      - name: 'android: 16 KiB pages'
        run: bash tools/check/page-align.sh "$AAR"
      - name: 'android: consumer keep rules (R8)'
        run: bash tools/check/android-keep-rules.sh "$AAR"
        env: { KSL_R8_REQUIRED: '1' }   # R8 pinned in gradle/libs.versions.toml (ksR8Jar), android.jar with the SDK: the run and its negative control may not be skipped
      - name: 'jvm/android: service keep rules (R8)'
        run: |
          $G :kuicksilver-ktor-client:jvmJar :kuicksilver-ktor-client:bundleAndroidMainAar
          bash tools/check/service-keep-rules.sh "$(ls -t kuicksilver-ktor-client/build/libs/kuicksilver-ktor-client-jvm-*.jar | head -1)" kuicksilver-ktor-client/build/outputs/aar/kuicksilver-ktor-client.aar
        env: { KSL_R8_REQUIRED: '1' }
      - name: 'android: free disk for the emulator'
        # Run 38287900994: both emulators exited before adb saw them and the action only reported a boot timeout. The
        # OpenSSL work tree, three Android ABIs and the AAR fill the runner before the AVD's userdata partition is
        # created; the source tarball cache stays, the work tree and preinstalled toolchains this job never uses go.
        run: |
          df -h / | tail -1
          rm -rf build/openssl-work/build build/openssl-work/src/openssl-*/
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk/2[0-7]* /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: 'android: device tests (emulator)'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          # the action hides the emulator's own exit message; free space before the AVD is created is the first suspect
          pre-emulator-launch-script: df -h / | tail -1
          script: ./gradlew --stacktrace androidConnectedCheck
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: 'reports-android-${{ matrix.api }}'
          path: '**/build/reports/'
          retention-days: 7

  jdk-compat:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',jdk-compat,')) }}
    # Review I7: the libraries promise JVM 17. Compiled against the JDK 17 API (-Xjdk-release=17, always on in kuicksilver.kmp),
    # every JVM suite runs on Temurin 17; on JDK 25 the same suites run with restricted native access denied unless the
    # application enables it (JEP 472) — the library must never need more than --enable-native-access.
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        jdk: [17, 25]
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: testjdk
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '${{ matrix.jdk }}'
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: jni-linux-x86_64, path: kuicksilver-native/build/jni }
      - name: 'jvm: all module tests on JDK ${{ matrix.jdk }} (JDK 17 API)'
        env:
          TEST_JDK: ${{ steps.testjdk.outputs.path }}
          TEST_JVM_ARGS: ${{ matrix.jdk == 25 && '--illegal-native-access=deny --enable-native-access=ALL-UNNAMED' || '' }}
        run: |
          . tools/ci/matrix.sh
          # shellcheck disable=SC2086
          $G --continue -x :kuicksilver-native:buildJniHost -Pkuicksilver.test.jdk=${{ matrix.jdk }} \
            "-Porg.gradle.java.installations.paths=$TEST_JDK" ${TEST_JVM_ARGS:+"-Pkuicksilver.test.jvmArgs=$TEST_JVM_ARGS"} $KSL_JVM_TESTS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: 'reports-jdk-${{ matrix.jdk }}'
          path: '**/build/reports/tests/'
          retention-days: 7

  interop-images:
    # Both interop endpoint images: JVM (kuicksilver-interop:local, with the manylinux libksl.so from the linux job)
    # and Kotlin/Native (kuicksilver-interop-native:local), built once and handed to the per-peer jobs.
    if: (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.interop)) && (inputs.only == '' || contains(format(',{0},', inputs.only), ',interop-images,'))
    needs: [openssl-docker, linux]
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { ndk: 'true', konan: 'linux_x64 linux_arm64', openssl-cache: interop }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: openssl-linux-x64, path: build/openssl/linux-x64 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: jni-linux-x86_64, path: kuicksilver-native/build/jni }
      - name: 'docker: image linux-x64'   # build-image.sh builds the .so in it when the artifact lacks the current ABI
        run: bash tools/openssl/build-docker.sh --image linux-x64
      - name: 'interop: jvm image'
        run: bash tools/interop/build-image.sh
      - name: 'interop: native image'
        run: bash tools/interop/build-image.sh --native
      - name: Save images
        run: docker save kuicksilver-interop:local kuicksilver-interop-native:local | gzip -1 > interop-images.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: interop-images, path: interop-images.tar.gz, if-no-files-found: error, retention-days: 3, compression-level: 0 }

  interop:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',interop,')) }}
    # The QUIC Interop Runner (pinned in tools/interop/runner.lock) with kuicksilver as server and as client against each peer;
    # --check-required fails on any cell of tools/interop/required.json in this run's scope (its image, peer and cases).
    needs: interop-images
    strategy:
      fail-fast: false
      matrix:
        image: [jvm, native]
        peer: [quic-go, ngtcp2, quiche, picoquic, quinn, msquic]   # = KSL_INTEROP_PEERS in tools/ci/matrix.sh
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: interop-images }
      - name: Load images
        run: gunzip -c interop-images.tar.gz | docker load && rm interop-images.tar.gz
      - name: Runner prerequisites
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends tshark python3-venv
          sudo modprobe ip6table_filter   # the simulator's IPv6 network
      - name: 'interop: ${{ matrix.image }} image vs ${{ matrix.peer }}, required cells'
        env:
          IMAGE: ${{ matrix.image }}
          PEER: ${{ matrix.peer }}
        run: |
          . tools/ci/matrix.sh
          case " $KSL_INTEROP_PEERS " in *" $PEER "*) ;; *) echo "::error::$PEER is not in KSL_INTEROP_PEERS (tools/ci/matrix.sh)"; exit 1 ;; esac
          if [ "$IMAGE" = native ]; then
            bash tools/interop/run-local.sh --check-required --image native -t "$KSL_INTEROP_NATIVE_CASES" "$PEER"
          else
            bash tools/interop/run-local.sh --check-required -t "$KSL_INTEROP_CASES" "$PEER"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: 'interop-${{ matrix.image }}-${{ matrix.peer }}'
          path: build/interop/2*
          retention-days: 14

  jvm-jar:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',jvm-jar,')) }}
    # The kuicksilver-native JVM jar as it is published: libksl for every JVM platform, each library built (and, except the
    # Windows dll and the Intel-Mac dylib, tested) by its own job and checked against that job's manifest.sha256.
    # buildJniHost is excluded: on this runner it would replace the manylinux .so with a host-gcc build.
    needs: [openssl-docker, linux, apple]
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: 'jni-*', path: build/jni-artifacts }
      - name: 'jvm: collect JNI libraries'
        run: bash tools/ci/collect-jni.sh build/jni-artifacts
      - name: 'jvm: jar with every JNI library'
        run: |
          $G --max-workers=2 -Pkuicksilver.openssl.prebuilt=true -x :kuicksilver-native:buildJniHost :kuicksilver-native:jvmJar
          set -- kuicksilver-native/build/libs/kuicksilver-native-jvm-*.jar
          unzip -l "$1" 'META-INF/native/*'
          bash tools/ci/collect-jni.sh --check-jar "$1"

  consumer-smoke:
    if: ${{ (inputs.only == '' || contains(format(',{0},', inputs.only), ',consumer-smoke,')) }}
    # The published artifacts consumed the way a user does: publishToMavenLocal (unsigned, the jar with all five JNI
    # libraries), then samples/realtime-telemetry built from mavenLocal() without includeBuild (tools/check/consumer-smoke.sh).
    needs: [openssl-docker, jvm-jar]
    runs-on: xcode-27   # Xcode 27.0 (27A266a, gradle/toolchains.toml) is only on this preview image; macos-26 has 26.x
    permissions: { contents: read }
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
        with: { ndk: 'true', xcode: 'true', konan: 'linux_x64 linux_arm64 mingw_x64', openssl-cache: apple }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: openssl-mingw-x64, path: build/openssl/mingw-x64 }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: 'jni-*', path: build/jni-artifacts }
      - name: 'jvm: collect JNI libraries'
        run: bash tools/ci/collect-jni.sh build/jni-artifacts
      - name: 'publish: mavenLocal'
        run: $G --max-workers=2 -Pkuicksilver.sign=false -x :kuicksilver-native:buildJniHost publishToMavenLocal
      - name: 'sample: realtime-telemetry from mavenLocal'
        run: bash tools/check/consumer-smoke.sh
