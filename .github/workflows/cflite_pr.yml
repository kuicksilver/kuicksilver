# ClusterFuzzLite PR fuzzing of the Jazzer targets (.clusterfuzzlite/). Off until the repository variable KSL_CFLITE is
# 'true' (set it after the first public push, once the build has been checked on a runner); actions pinned by commit SHA.
# Superseded for this project by local campaigns (tools/fuzz/campaign.sh, CONTRIBUTING "Fuzzing"); kept disabled.
name: ClusterFuzzLite PR fuzzing
on:
  pull_request:
    paths:
      - 'kuicksilver-native/**'
      - 'kuicksilver-tls/**'
      - 'kuicksilver-quic/**'
      - 'kuicksilver-http3/**'
      - 'gradle/**'
      - 'tools/openssl/**'
      - 'tools/build-jni.sh'
      - '.clusterfuzzlite/**'
      - '.github/workflows/cflite_pr.yml'
permissions: read-all
jobs:
  PR:
    if: vars.KSL_CFLITE == 'true'   # off until the first publication (see the header)
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.sanitizer }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - address   # for JVM projects the only sanitizer setting; Jazzer reports Kotlin/Java findings
    steps:
      - name: Build Fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: jvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run Fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: 'code-change'
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
