# Fuzzing campaign on GitHub-hosted runners: tools/fuzz/campaign.sh (CONTRIBUTING.md, "Fuzzing"), one runner per target.
#
#   prepare: target list, OpenSSL linux-x64 ── fuzz (one job per target, campaign.sh run --goal H --fork <cpus>) ── summary
#                                                                                                              └─ corpus-cache
#
# Each fuzz job owns its runner, so campaign.sh runs without its laptop manners: nice 0, no gap between slices, and
# libFuzzer/Jazzer fork mode with one worker per CPU on the job's one target (slices stay at the 20-minute maximum; every
# slice restarts the fuzzer on the grown corpus). The grown corpus of each target persists across runs in the Actions cache
# (fuzz-corpus-<target>-<run>-<attempt>: the newest entry is restored, readable from main by every branch; at the end of
# every run, crash or not, campaign.sh prune reduces it to the inputs that add coverage beyond tools/fuzz/corpus/ and the
# seeds, and it is saved under a new key, since a cache entry cannot be replaced; the corpus-cache job, the only one with
# actions: write, then deletes this ref's older entries, so each target keeps one entry per ref). The pruned corpus is
# also the fuzz-corpus-<target> artifact (90 days), restored when the cache has no entry (evicted: the repository's build
# caches already exceed the default 10 GB, so the weekly corpora are evicted first). The fallback takes the artifact only
# from a fuzz.yml run of this repository on main started by the schedule or by hand (never from another workflow or a
# fork's run), and keeps only its regular files. Corpus inputs are not sensitive, and a fuzzer's reproducers never go
# into its corpus; still, a target with a finding saves neither its cache entry nor its corpus artifact in that run. tools/fuzz/campaign.sh minimize locally is still how inputs reach tools/fuzz/corpus/.
# Statistics and slice logs start fresh every run, so --goal is the time of this run.
# A finding (crash-*, a reproducible timeout-*, oom-*) fails the job, which notifies the maintainers. Its reproducer and
# the slice logs (stack traces) are NEVER uploaded: artifacts of a public repository are public, and a crash in the TLS,
# QUIC or HTTP parsers may be remotely triggerable, so it stays private until fixed (SECURITY.md). Only stats.tsv (the
# finding's file name, no input) is the fuzz-stats-<target> artifact; the maintainers reproduce the finding locally with
# tools/fuzz/campaign.sh. That a target found something is visible in the public run (its job fails); what it found is
# not. The summary job prints the campaign.sh status table of all targets. ClusterFuzzLite
# (.github/workflows/cflite_pr.yml, disabled) stays as it is.
name: fuzz
on:
  # weekly, every target for the default hours (inputs are empty on a schedule: the defaults below apply)
  schedule:
    - cron: '37 2 * * 6'   # Saturday 02:37 UTC, off the hour when scheduled runs pile up
  workflow_dispatch:
    inputs:
      hours_per_target:
        description: fuzzing hours per target (0.1 .. 4.5; each target gets its own runner)
        type: string
        default: '2'
      targets:
        description: comma-separated target ids (tools/fuzz/campaign.sh list), or all
        type: string
        default: all
permissions: {}
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    timeout-minutes: 60
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      hours: ${{ steps.targets.outputs.hours }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: 'fuzz: targets and hours'
        id: targets
        env:
          TARGETS: ${{ inputs.targets || 'all' }}
          HOURS: ${{ inputs.hours_per_target || '2' }}
        run: |
          # the fuzz job's 350 minutes (6 h is GitHub's maximum): at most 270 of slices, 20 for the prune step, and 60 for the
          # set-up, the build, the cache save and the uploads
          awk -v h="$HOURS" 'BEGIN { exit !(h ~ /^[0-9]+(\.[0-9]+)?$/ && h >= 0.1 && h <= 4.5) }' || { echo "::error::hours_per_target '$HOURS' is not a number in 0.1 .. 4.5"; exit 1; }
          all=$(bash tools/fuzz/campaign.sh list)
          set -f   # the ids are split on commas and blanks, never globbed against the checkout
          if [ -z "$TARGETS" ] || [ "$TARGETS" = all ]; then ids=$all; else
            ids=""; for id in ${TARGETS//,/ }; do
              grep -qxF "$id" <<< "$all" || { echo "::error::unknown target $id; known: $(echo "$all" | tr '\n' ' ')"; exit 1; }
              ids="$ids$id"$'\n'
            done
          fi
          set +f
          # blanks or commas only: no target, which would otherwise reach the fuzz job as an empty matrix
          [ -n "$ids" ] || { echo "::error::targets '$TARGETS' names no target; give ids (tools/fuzz/campaign.sh list) or all"; exit 1; }
          json=$(printf '%s\n' "$ids" | jq -R -s -c 'split("\n") | map(select(length > 0)) | unique')
          echo "targets: $json, $HOURS h each"
          { echo "targets=$json"; echo "hours=$HOURS"; } >> "$GITHUB_OUTPUT"
      # the linux-x64 OpenSSL of build.yml's openssl-docker job (same cache key), for buildJniHost and the ksl harness
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/openssl-work/cache
            build/openssl-work/src/*.tar.gz
            build/openssl-work/src/*.tar.gz.asc
          key: openssl-docker-linux-x64-${{ runner.arch }}-${{ hashFiles('gradle/openssl.toml', 'tools/openssl/**') }}
      - name: 'openssl: fetch and verify'
        run: bash tools/openssl/fetch.sh
      - name: 'openssl: build linux-x64'
        run: bash tools/openssl/build-docker.sh linux-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openssl-linux-x64
          path: build/openssl/linux-x64
          if-no-files-found: error
          retention-days: 1

  fuzz:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    runs-on: ubuntu-24.04
    permissions: { contents: read, actions: read }   # actions: read for the corpus artifact of an earlier run
    timeout-minutes: 350
    env:
      KSL_FUZZ_STATE: ${{ github.workspace }}/build/fuzz-campaign
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: openssl-linux-x64, path: build/openssl/linux-x64 }
      - name: 'fuzz: clang with libFuzzer (ksl harness)'
        if: startsWith(matrix.target, 'ksl.')
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends clang libclang-rt-18-dev
          clang --version | head -1
      - name: 'fuzz: restore the ${{ matrix.target }} corpus'
        # a cache service that hangs costs at most two minutes: the run starts from the seeds, and its corpus is not saved
        # (a newer key that restore-keys prefers would replace what had grown with what this run found alone)
        id: restore
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz-campaign/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: 'fuzz: restore the ${{ matrix.target }} corpus from its newest artifact (no cache entry)'
        if: steps.restore.outcome == 'success' && steps.restore.outputs.cache-matched-key == ''
        timeout-minutes: 5
        continue-on-error: true   # no artifact either: the run starts from the seeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # only runs of this workflow, on main, of this repository (not a fork), started by the schedule or by hand: the
          # artifacts API is repository-wide, and a fork's pull request can upload an artifact of the same name
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/fuzz.yml/runs?branch=main&status=completed&per_page=50" \
            --jq '.workflow_runs[] | select((.event == "schedule" or .event == "workflow_dispatch") and .head_repository.id == .repository.id) | .id')
          id=""
          for rid in $runs; do   # newest first
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid/artifacts?name=fuzz-corpus-$TARGET" \
              --jq '[.artifacts[] | select(.expired | not)] | first | .id // empty')
            [ -z "$id" ] || break
          done
          [ -n "$id" ] || { echo "no fuzz-corpus-$TARGET artifact of a main fuzz run: starting from the seeds"; exit 0; }
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/corpus.zip"
          # refuse names that leave the directory; extract aside and keep regular files only (no links, devices, fifos)
          names=$(unzip -Z1 "$RUNNER_TEMP/corpus.zip")
          if grep -Eq '(^/|(^|/)\.\.(/|$))' <<< "$names"; then echo "::warning::artifact $id has paths outside its directory; not used"; exit 0; fi
          x="$RUNNER_TEMP/corpus-x"; rm -rf "$x"; mkdir -p "$x" "build/fuzz-campaign/corpus/$TARGET"
          unzip -q "$RUNNER_TEMP/corpus.zip" -d "$x"
          find "$x" ! -type f ! -type d -delete
          find "$x" -type f -exec cp {} "build/fuzz-campaign/corpus/$TARGET/" \;
          echo "corpus artifact $id: $(find "build/fuzz-campaign/corpus/$TARGET" -type f | wc -l | tr -d ' ') inputs"
      - name: 'fuzz: ${{ matrix.target }} for ${{ needs.prepare.outputs.hours }} h'
        env:
          HOURS: ${{ needs.prepare.outputs.hours }}
        run: |
          n=$(find "build/fuzz-campaign/corpus/$TARGET" -type f 2>/dev/null | wc -l | tr -d ' '); echo "restored corpus: $n inputs"
          bash tools/fuzz/campaign.sh run --targets "$TARGET" --goal "$HOURS" --jobs 1 --fork "$(nproc)" --nice 0 --gap 0 --slice 20
      - name: 'fuzz: prune the ${{ matrix.target }} corpus'   # what the cache keeps: inputs beyond the committed corpus and the seeds
        if: always()
        timeout-minutes: 20
        continue-on-error: true   # a prune that fails or times out is no finding: the corpus is then cached as it grew
        run: |
          [ -d "build/fuzz-campaign/corpus/$TARGET" ] || { echo "no corpus to prune"; exit 0; }
          bash tools/fuzz/campaign.sh prune --no-build --nice 0 --targets "$TARGET" \
            || echo "::warning::$TARGET: the corpus could not be pruned, it is cached as it grew"
      - name: 'fuzz: restore a corpus replacement the prune did not finish'
        if: always()
        timeout-minutes: 2
        # campaign.sh puts back a corpus a killed prune left between its two renames (<corpus>.old) before any command runs
        run: bash tools/fuzz/campaign.sh list > /dev/null
      - name: 'fuzz: did ${{ matrix.target }} find something'
        # a target with a finding keeps its corpus out of the cache and the artifacts in this run (see the header)
        id: finding
        if: always()
        run: |
          f=false
          if [ -f "build/fuzz-campaign/crashed-$TARGET" ] || [ -n "$(find "build/fuzz-campaign/crashes/$TARGET" -type f \( -name 'crash-*' -o -name 'timeout-*' -o -name 'oom-*' -o -name 'leak-*' \) 2>/dev/null)" ]; then f=true; fi
          echo "found=$f" >> "$GITHUB_OUTPUT"
      - name: 'fuzz: the corpus was not restored'
        if: always() && steps.restore.outcome != 'success'
        run: echo "::warning::corpus not restored; this run's corpus is not cached"
      - name: 'fuzz: save the ${{ matrix.target }} corpus'
        # a first run finds no entry and still succeeds: its corpus is saved
        if: always() && steps.restore.outcome == 'success' && steps.finding.outputs.found == 'false'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz-campaign/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # the corpus fallback for an evicted cache entry (see the header); a reproducer is never in it
        if: always() && steps.restore.outcome == 'success' && steps.finding.outputs.found == 'false' && hashFiles(format('build/fuzz-campaign/corpus/{0}/**', matrix.target)) != ''
        continue-on-error: true
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: build/fuzz-campaign/corpus/${{ matrix.target }}
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # stats.tsv only: reproducers, crash markers, load timeouts and slice logs stay on the runner (see the header)
        if: always()
        with:
          name: fuzz-stats-${{ matrix.target }}
          path: build/fuzz-campaign/stats.tsv
          if-no-files-found: warn
          retention-days: 30
      - name: 'fuzz: findings'
        run: |
          found=$(find "build/fuzz-campaign/crashes/$TARGET" -type f \( -name 'crash-*' -o -name 'timeout-*' -o -name 'oom-*' -o -name 'leak-*' \) 2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "::error::$TARGET: finding(s) $(echo "$found" | xargs -n1 basename 2>/dev/null | tr '\n' ' '); the reproducer is not uploaded (SECURITY.md: findings stay private until fixed). Reproduce locally with tools/fuzz/campaign.sh run --targets $TARGET"
            exit 1
          fi
          if [ -f "build/fuzz-campaign/crashed-$TARGET" ]; then   # campaign.sh records exit-N when the fuzzer left no reproducer
            last=$(awk -F'\t' -v id="$TARGET" '$2 == id { r = $8 } END { print r }' build/fuzz-campaign/stats.tsv 2>/dev/null || true)
            echo "::error::$TARGET: the fuzzer ended with ${last:-a non-zero exit} and left no reproducer (a JVM that did not start, a flag Jazzer rejected, the runner's OOM killer); the slice logs are not uploaded: reproduce locally with tools/fuzz/campaign.sh run --targets $TARGET"
            exit 1
          fi
          echo "$TARGET: no finding"

  summary:
    needs: [prepare, fuzz]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: 'fuzz-stats-*', path: build/fuzz-artifacts }
      - name: 'fuzz: status of every target'
        env:
          KSL_FUZZ_STATE: ${{ github.workspace }}/build/fuzz-summary
          HOURS: ${{ needs.prepare.outputs.hours }}
        run: |
          # one campaign state from the per-target stats.tsv lines (a finding is the file name in their result column)
          mkdir -p "$KSL_FUZZ_STATE"
          for d in build/fuzz-artifacts/fuzz-stats-*; do
            [ -f "$d/stats.tsv" ] && cat "$d/stats.tsv" >> "$KSL_FUZZ_STATE/stats.tsv"
          done
          table=$(bash tools/fuzz/campaign.sh status)
          printf '%s\n' "$table"
          { echo "### Fuzzing, $HOURS h per target"; echo; echo '```'; printf '%s\n' "$table"; echo '```'
            echo; echo "stats.tsv: the \`fuzz-stats-<target>\` artifacts. Reproducers and logs are not uploaded (SECURITY.md); reproduce a finding locally with \`tools/fuzz/campaign.sh run --targets <target>\`."; } >> "$GITHUB_STEP_SUMMARY"

  corpus-cache:
    # one corpus entry per target and ref: a cache entry cannot be overwritten, so every run saves a new key and this job
    # deletes the older ones of this run's ref (branches only read main's entries, they never delete them)
    needs: [prepare, fuzz]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    permissions: { actions: write }
    timeout-minutes: 10
    steps:
      - name: 'fuzz: keep the newest corpus entry per target'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ needs.prepare.outputs.targets }}
        run: |
          caches=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key fuzz-corpus- --limit 1000 --json id,key,createdAt)
          for t in $(jq -r '.[]' <<< "$TARGETS"); do
            old=$(jq -r --arg p "fuzz-corpus-$t-" '[.[] | select((.key | startswith($p)) and (.key | ltrimstr($p) | test("^[0-9]+-[0-9]+$")))]
              | sort_by(.createdAt) | reverse | .[1:] | .[].id' <<< "$caches")
            for id in $old; do gh cache delete --repo "$GITHUB_REPOSITORY" "$id"; done
            echo "$t: $(wc -w <<< "$old" | tr -d ' ') older entr(y/ies) deleted"
          done
