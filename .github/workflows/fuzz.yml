# Fuzzing campaign on GitHub-hosted runners: tools/fuzz/campaign.sh (CONTRIBUTING.md, "Fuzzing"), one runner per target.
#
#   prepare: target list, OpenSSL linux-x64 ── fuzz (one job per target, campaign.sh run --goal H --fork <cpus>) ── summary
#                                                                                                              └─ corpus-cache
#
# Each fuzz job owns its runner, so campaign.sh runs without its laptop manners: nice 0, no gap between slices, and
# libFuzzer/Jazzer fork mode with one worker per CPU on the job's one target (slices stay at the 20-minute maximum; every
# slice restarts the fuzzer on the grown corpus). The grown corpus of each target persists across runs in the Actions cache
# (fuzz-corpus-<target>-<run>-<attempt>: the newest entry is restored, readable from main by every branch; at the end of
# every run, crash or not, campaign.sh prune reduces it to the inputs that add coverage beyond tools/fuzz/corpus/ and the
# seeds, and it is saved under a new key, since a cache entry cannot be replaced; the corpus-cache job, the only one with
# actions: write, then deletes this ref's older entries, so each target keeps one entry per ref);
# tools/fuzz/campaign.sh minimize locally is still how inputs reach tools/fuzz/corpus/. Statistics and slice logs start
# fresh every run, so --goal is the time of this run. A finding (crash-*, a reproducible timeout-*, oom-*) fails the job;
# the reproducers, logs and stats.tsv are the fuzz-<target> artifact, and the summary job prints the campaign.sh status
# table of all targets. ClusterFuzzLite (.github/workflows/cflite_pr.yml, disabled) stays as it is.
name: fuzz
on:
  # a weekly schedule comes back with the other triggers (build.yml); it would go here, e.g.
  # schedule:
  #   - cron: '0 2 * * 6'
  workflow_dispatch:
    inputs:
      hours_per_target:
        description: fuzzing hours per target (0.1 .. 4.5; each target gets its own runner)
        type: string
        default: '2'
      targets:
        description: comma-separated target ids (tools/fuzz/campaign.sh list), or all
        type: string
        default: all
permissions: {}
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    timeout-minutes: 60
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      hours: ${{ steps.targets.outputs.hours }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: 'fuzz: targets and hours'
        id: targets
        env:
          TARGETS: ${{ inputs.targets }}
          HOURS: ${{ inputs.hours_per_target }}
        run: |
          # the fuzz job's 350 minutes (6 h is GitHub's maximum): at most 270 of slices, 20 for the prune step, and 60 for the
          # set-up, the build, the cache save and the uploads
          awk -v h="$HOURS" 'BEGIN { exit !(h ~ /^[0-9]+(\.[0-9]+)?$/ && h >= 0.1 && h <= 4.5) }' || { echo "::error::hours_per_target '$HOURS' is not a number in 0.1 .. 4.5"; exit 1; }
          all=$(bash tools/fuzz/campaign.sh list)
          set -f   # the ids are split on commas and blanks, never globbed against the checkout
          if [ -z "$TARGETS" ] || [ "$TARGETS" = all ]; then ids=$all; else
            ids=""; for id in ${TARGETS//,/ }; do
              grep -qxF "$id" <<< "$all" || { echo "::error::unknown target $id; known: $(echo "$all" | tr '\n' ' ')"; exit 1; }
              ids="$ids$id"$'\n'
            done
          fi
          set +f
          # blanks or commas only: no target, which would otherwise reach the fuzz job as an empty matrix
          [ -n "$ids" ] || { echo "::error::targets '$TARGETS' names no target; give ids (tools/fuzz/campaign.sh list) or all"; exit 1; }
          json=$(printf '%s\n' "$ids" | jq -R -s -c 'split("\n") | map(select(length > 0)) | unique')
          echo "targets: $json, $HOURS h each"
          { echo "targets=$json"; echo "hours=$HOURS"; } >> "$GITHUB_OUTPUT"
      # the linux-x64 OpenSSL of build.yml's openssl-docker job (same cache key), for buildJniHost and the ksl harness
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/openssl-work/cache
            build/openssl-work/src/*.tar.gz
            build/openssl-work/src/*.tar.gz.asc
          key: openssl-docker-linux-x64-${{ runner.arch }}-${{ hashFiles('gradle/openssl.toml', 'tools/openssl/**') }}
      - name: 'openssl: fetch and verify'
        run: bash tools/openssl/fetch.sh
      - name: 'openssl: build linux-x64'
        run: bash tools/openssl/build-docker.sh linux-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openssl-linux-x64
          path: build/openssl/linux-x64
          if-no-files-found: error
          retention-days: 1

  fuzz:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    timeout-minutes: 350
    env:
      KSL_FUZZ_STATE: ${{ github.workspace }}/build/fuzz-campaign
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: openssl-linux-x64, path: build/openssl/linux-x64 }
      - name: 'fuzz: clang with libFuzzer (ksl harness)'
        if: startsWith(matrix.target, 'ksl.')
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends clang libclang-rt-18-dev
          clang --version | head -1
      - name: 'fuzz: restore the ${{ matrix.target }} corpus'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz-campaign/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: 'fuzz: ${{ matrix.target }} for ${{ needs.prepare.outputs.hours }} h'
        env:
          HOURS: ${{ needs.prepare.outputs.hours }}
        run: |
          n=$(find "build/fuzz-campaign/corpus/$TARGET" -type f 2>/dev/null | wc -l | tr -d ' '); echo "restored corpus: $n inputs"
          bash tools/fuzz/campaign.sh run --targets "$TARGET" --goal "$HOURS" --jobs 1 --fork "$(nproc)" --nice 0 --gap 0 --slice 20
      - name: 'fuzz: prune the ${{ matrix.target }} corpus'   # what the cache keeps: inputs beyond the committed corpus and the seeds
        if: always()
        timeout-minutes: 20
        continue-on-error: true   # a prune that fails or times out is no finding: the corpus is then cached as it grew
        run: |
          [ -d "build/fuzz-campaign/corpus/$TARGET" ] || { echo "no corpus to prune"; exit 0; }
          bash tools/fuzz/campaign.sh prune --no-build --nice 0 --targets "$TARGET" \
            || echo "::warning::$TARGET: the corpus could not be pruned, it is cached as it grew"
      - name: 'fuzz: save the ${{ matrix.target }} corpus'
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz-campaign/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            build/fuzz-campaign/stats.tsv
            build/fuzz-campaign/crashed-*
            build/fuzz-campaign/crashes/
            build/fuzz-campaign/load-timeouts/
            build/fuzz-campaign/logs/
          if-no-files-found: warn
          retention-days: 30
      - name: 'fuzz: findings'
        run: |
          found=$(find "build/fuzz-campaign/crashes/$TARGET" -type f \( -name 'crash-*' -o -name 'timeout-*' -o -name 'oom-*' -o -name 'leak-*' \) 2>/dev/null || true)
          if [ -n "$found" ]; then
            echo "::error::$TARGET: finding(s), reproducers in the fuzz-$TARGET artifact: $(echo "$found" | xargs -n1 basename 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          if [ -f "build/fuzz-campaign/crashed-$TARGET" ]; then   # campaign.sh records exit-N when the fuzzer left no reproducer
            last=$(awk -F'\t' -v id="$TARGET" '$2 == id { r = $8 } END { print r }' build/fuzz-campaign/stats.tsv 2>/dev/null || true)
            echo "::error::$TARGET: the fuzzer ended with ${last:-a non-zero exit} and left no reproducer (a JVM that did not start, a flag Jazzer rejected, the runner's OOM killer): see logs/ in the fuzz-$TARGET artifact"
            exit 1
          fi
          echo "$TARGET: no finding"

  summary:
    needs: [prepare, fuzz]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: 'fuzz-*', path: build/fuzz-artifacts }
      - name: 'fuzz: status of every target'
        env:
          KSL_FUZZ_STATE: ${{ github.workspace }}/build/fuzz-summary
          HOURS: ${{ needs.prepare.outputs.hours }}
        run: |
          # one campaign state from the per-target artifacts: their stats.tsv lines and crash directories
          mkdir -p "$KSL_FUZZ_STATE/crashes"
          for d in build/fuzz-artifacts/fuzz-*; do
            [ -d "$d" ] || continue
            [ -f "$d/stats.tsv" ] && cat "$d/stats.tsv" >> "$KSL_FUZZ_STATE/stats.tsv"
            [ -d "$d/crashes" ] && cp -R "$d/crashes/." "$KSL_FUZZ_STATE/crashes/"
          done
          table=$(bash tools/fuzz/campaign.sh status)
          printf '%s\n' "$table"
          { echo "### Fuzzing, $HOURS h per target"; echo; echo '```'; printf '%s\n' "$table"; echo '```'
            echo; echo "Reproducers, logs and stats.tsv: the \`fuzz-<target>\` artifacts of this run."; } >> "$GITHUB_STEP_SUMMARY"

  corpus-cache:
    # one corpus entry per target and ref: a cache entry cannot be overwritten, so every run saves a new key and this job
    # deletes the older ones of this run's ref (branches only read main's entries, they never delete them)
    needs: [prepare, fuzz]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    permissions: { actions: write }
    timeout-minutes: 10
    steps:
      - name: 'fuzz: keep the newest corpus entry per target'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ needs.prepare.outputs.targets }}
        run: |
          caches=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key fuzz-corpus- --limit 1000 --json id,key,createdAt)
          for t in $(jq -r '.[]' <<< "$TARGETS"); do
            old=$(jq -r --arg p "fuzz-corpus-$t-" '[.[] | select((.key | startswith($p)) and (.key | ltrimstr($p) | test("^[0-9]+-[0-9]+$")))]
              | sort_by(.createdAt) | reverse | .[1:] | .[].id' <<< "$caches")
            for id in $old; do gh cache delete --repo "$GITHUB_REPOSITORY" "$id"; done
            echo "$t: $(wc -w <<< "$old" | tr -d ' ') older entr(y/ies) deleted"
          done
