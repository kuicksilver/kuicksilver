# Gradle wrapper validation: gradle/wrapper/gradle-wrapper.jar must be byte for byte a jar of an official Gradle release
# (its SHA-256 among the checksums services.gradle.org publishes), so a pull request cannot slip in a modified wrapper
# that every ./gradlew would run. The distribution the wrapper downloads is pinned separately by distributionSha256Sum
# in gradle-wrapper.properties (tools/check/pins.sh).
#
# A workflow of its own, a single fast job, on purpose: OpenSSF Scorecard (Binary-Artifacts) accepts the checked-in jar
# only when a workflow using gradle/actions/wrapper-validation has a successful run for the newest commit of main, and
# the build workflow's run is long and is cancelled by a newer push. Read-only, no secrets; actions pinned by commit SHA.
name: gradle-wrapper
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:
permissions: {}

jobs:
  validation:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: 'gradle-wrapper.jar is an official Gradle release'
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
