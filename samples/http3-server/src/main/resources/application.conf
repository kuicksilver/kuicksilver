#
# The whole server configuration. Every key reads an environment variable when it is set (${?NAME}), so a container or
# a systemd unit changes it without a rebuild; every Kuicksilver key not set here keeps its default
# (docs/guide/ktor.md, "EngineMain and configuration keys").
ktor {
    deployment {
        port = 8443                    # TCP: HTTP/2 and HTTP/1.1 over TLS; UDP: HTTP/3. The same number.
        port = ${?PORT}
    }
    application {
        modules = [ io.kuicksilver.sample.http3.MainKt.module ]
    }
}
kuicksilver {
    tls {
        # PEM files; certs/gen.sh writes a development pair here. In production: certbot's fullchain.pem and privkey.pem
        certificateChain = "build/dev-certs/chain.pem"
        certificateChain = ${?TLS_CHAIN}
        privateKey = "build/dev-certs/key.pem"
        privateKey = ${?TLS_KEY}
        reloadInterval = 1h            # a renewed certificate is picked up without a restart
    }
    http2.enabled = true               # offer h2 before http/1.1 in ALPN on the TCP port
    http3 {
        altSvc = true                  # Alt-Svc: h3=":<port>" on HTTP/1.1 and HTTP/2 responses, ALTSVC frames on HTTP/2
        altSvc = ${?ALT_SVC}
    }
    # The PROXY protocol (HAProxy's, v1 and v2) on the TCP port, off unless PROXY_TRUSTED_SOURCES names the proxies
    # ("10.0.0.0/8,192.0.2.10"): every TCP connection must then come from one of them and start with the header.
    connector.proxyProtocol.trustedSources = ${?PROXY_TRUSTED_SOURCES}
}
