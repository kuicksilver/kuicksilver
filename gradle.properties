org.gradle.jvmargs=-Xmx2g
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.code.style=official
kotlin.mpp.enableCInteropCommonization=true
kotlin.native.ignoreDisabledTargets=true
android.useAndroidX=true
# Apple klibs with the ksl cinterop can only be built on macOS (the apple CI job and releases build them there);
# this silences Kotlin's "Cross Compilation with Cinterop Not Supported" warnings on Linux hosts.
kotlin.native.enableKlibsCrossCompilation=false
