# Pin profile of the non-blocking CI job `openssl-next` (.github/workflows/build.yml): the newest OpenSSL 4.x release, built and
# tested beside the 3.5 LTS pin of gradle/openssl.toml. Never used for a release or any published artifact; 0.3.0 stays on
# 3.5 (docs/stability.md, OpenSSL). Selected by KSL_OPENSSL_PIN=gradle/openssl-next.toml (tools/openssl/fetch.sh, build.sh) and
# -Pkuicksilver.openssl.pin=gradle/openssl-next.toml (kuicksilver-native/openssl.gradle.kts). The same rules as the main pin:
# version, tarball SHA-256 and signing key fingerprint are updated together (4.1.0 is signed by a subkey of the same release key).
[openssl]
version = "4.1.0"
sha256 = "50c17baf54cb008f6ce42d50deb4b28050a1aad711636cabd4b241c7e90cc2fd"
pgp_fingerprint = "B146647E45A7B33947AB226B2A2C87D161692D40"
configure_flags = "tools/openssl/configure-flags.txt"
