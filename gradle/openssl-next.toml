# Pin profile of the non-blocking CI job `openssl-next` (.github/workflows/build.yml): the next OpenSSL 4.x release, built and
# tested beside the pin of gradle/openssl.toml before that pin moves to it (the same release until a newer one is pinned
# here). Never used for a release or any published artifact (docs/stability.md, OpenSSL). Selected by KSL_OPENSSL_PIN=gradle/openssl-next.toml (tools/openssl/fetch.sh, build.sh) and
# -Pkuicksilver.openssl.pin=gradle/openssl-next.toml (kuicksilver-native/openssl.gradle.kts). The same rules as the main pin:
# version, tarball SHA-256 and signing key fingerprint are updated together (4.1.0 is signed by a subkey of the same release key).
[openssl]
version = "4.1.0"
sha256 = "50c17baf54cb008f6ce42d50deb4b28050a1aad711636cabd4b241c7e90cc2fd"
pgp_fingerprint = "B146647E45A7B33947AB226B2A2C87D161692D40"
configure_flags = "tools/openssl/configure-flags.txt"
# The carried patch of gradle/openssl.toml (ADR-0019), as long as this pin names the same release or one the bug is not fixed in
patch = "tools/openssl/patches/openssl-4.1.0-ech-hrr-custom-ext.patch"
patch_sha256 = "948946d06b17dc0344e4b6db9ff792917d9c1a40ed533e3f2cc9f56c00335e41"
# The second carried patch (ADR-0019, bug C: an ECH rejection after a HelloRetryRequest), applied after the first. Upstream
# code (pull request #33233, in review); dropped with the first release that merges it.
patch_2 = "tools/openssl/patches/openssl-4.1.0-ech-hrr-rejection.patch"
patch_2_sha256 = "eb23e1ba5067175b8550c6595837922b97d9008661d856342a426c0fd535e160"
# The third carried patch (ADR-0019, M1): SSL_ech_get1_retry_config checks only the framing of the server's retry_configs and
# hands them over as sent, so one ECHConfig OpenSSL cannot use no longer drops the others (ksl checks each one). Kuicksilver's
# own code; dropped with the first release that fixes the upstream issue.
patch_3 = "tools/openssl/patches/openssl-4.1.0-ech-retry-configs-raw.patch"
patch_3_sha256 = "67177f932d70c2c693d4af06877224a41f0d7bbbd9120014c57d062833a6900c"
# The fourth carried patch (ADR-0019, S1-rfc): the inner server_name padding of RFC 9849 section 6.1.3, max(0, M - D) (4.1.0 pads
# 9 bytes less). Kuicksilver's own code; dropped with the first release that fixes the upstream issue.
patch_4 = "tools/openssl/patches/openssl-4.1.0-ech-sni-padding.patch"
patch_4_sha256 = "38159ca006c6adf66977fe7553607d9abb2bc6a7a2af32620a528a2d03170045"
