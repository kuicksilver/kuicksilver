# OpenSSL pin: the build downloads exactly this release and verifies its hash and signature. Update together: version, tarball SHA-256, signing key fingerprint.
# 4.1.0 (ADR-0019): signed by the subkey C46ED3F2CBEFDA1FDAADA44264ED7B1DCCE71CB2 of the pinned release key; the SHA-256 is that of the
# release's own .sha256 file.
[openssl]
version = "4.1.0"
sha256 = "50c17baf54cb008f6ce42d50deb4b28050a1aad711636cabd4b241c7e90cc2fd"
pgp_fingerprint = "B146647E45A7B33947AB226B2A2C87D161692D40"
configure_flags = "tools/openssl/configure-flags.txt"
# The first OpenSSL patch carried under ADR-0019 (bug B: ECH after a HelloRetryRequest with a client's own custom extension,
# which every QUIC client has), applied by tools/openssl/build.sh after the tarball's checks. Upstream code (commit
# openssl/openssl@981f976bb0, on the openssl-4.1 branch); dropped with 4.1.1.
patch = "tools/openssl/patches/openssl-4.1.0-ech-hrr-custom-ext.patch"
patch_sha256 = "948946d06b17dc0344e4b6db9ff792917d9c1a40ed533e3f2cc9f56c00335e41"
# The second carried patch (ADR-0019, bug C: an ECH rejection after a HelloRetryRequest), applied after the first. Upstream
# code (pull request #33233, in review); dropped with the first release that merges it.
patch_2 = "tools/openssl/patches/openssl-4.1.0-ech-hrr-rejection.patch"
patch_2_sha256 = "eb23e1ba5067175b8550c6595837922b97d9008661d856342a426c0fd535e160"
# The third carried patch (ADR-0019, M1): SSL_ech_get1_retry_config checks only the framing of the server's retry_configs and
# hands them over as sent, so one ECHConfig OpenSSL cannot use no longer drops the others (ksl checks each one). Kuicksilver's
# own code; dropped with the first release that fixes the upstream issue.
patch_3 = "tools/openssl/patches/openssl-4.1.0-ech-retry-configs-raw.patch"
patch_3_sha256 = "4cf0a4719d453ce2667ac943b7d541bcc5a03d4a46b46159ff8d202b8dc91241"
# The fourth carried patch (ADR-0019, S1-rfc): the inner server_name padding of RFC 9849 section 6.1.3, max(0, M - D) (4.1.0 pads
# 9 bytes less). Kuicksilver's own code; upstream issue #32170 (pull request #32930); dropped with the first release that fixes it.
patch_4 = "tools/openssl/patches/openssl-4.1.0-ech-sni-padding.patch"
patch_4_sha256 = "51aa52df86606da99e0c640ef0e9b6923c48d85f45dfa8c9b36f3ef809cd9a99"
# The fifth carried patch (ADR-0019): the ECH client checks the encrypted_client_hello of EncryptedExtensions (RFC 9849
# sections 5, 6.1.6, 6.2.1: unsupported_extension after an acceptance, decode_error for retry_configs that do not parse or
# have bytes after them; none handed out after GREASE). Kuicksilver's own code; dropped with the first release that fixes it.
patch_5 = "tools/openssl/patches/openssl-4.1.0-ech-ee-checks.patch"
patch_5_sha256 = "03771c0f5206eaea3814967f785ae8c14721631ee083de1937762c4a49e921b4"
# The sixth carried patch (ADR-0019): illegal_parameter for a pre_shared_key in the ServerHello after an ECH rejection (RFC 9849
# section 6.1.2). Kuicksilver's own code; dropped with the first release that fixes it.
patch_6 = "tools/openssl/patches/openssl-4.1.0-ech-psk-after-rejection.patch"
patch_6_sha256 = "e2b37d68ef29140306fafab17bdcd85bb4fd6eed65c04ba7be8ef943ed3c5b18"
# The seventh carried patch (ADR-0019): a GREASE ECH payload of the length a real offer of the same ClientHello would have (RFC
# 9849 section 6.2.1: L+C). Kuicksilver's own code; dropped with the first release that fixes it.
patch_7 = "tools/openssl/patches/openssl-4.1.0-ech-grease-length.patch"
patch_7_sha256 = "dd007b63bb37d0989dc49dd1eb609de966e3adf8ebbd8a0afb7b730108b74279"
# The eighth carried patch (ADR-0019): on an ECH rejection the client completes its flight (an empty Certificate when asked for
# one, RFC 9849 section 6.1.7; its Finished) and then sends ech_required (section 6.1.6). Kuicksilver's own code, the fix posted
# with upstream issue openssl/openssl#33831; dropped with the first release that fixes it.
patch_8 = "tools/openssl/patches/openssl-4.1.0-ech-reject-client-flight.patch"
patch_8_sha256 = "f0abcb89c18e2504bf7ee4d2fd2df99d9e41341ed56cc453488a7d847948e8a5"
# The ninth carried patch (ADR-0019): the inner ALPN extension padded up to a target, the longest ALPN extension across the
# client's application profiles (RFC 9849 section 6.1.3). Kuicksilver's own code; dropped with the first release that offers it.
patch_9 = "tools/openssl/patches/openssl-4.1.0-ech-alpn-padding.patch"
patch_9_sha256 = "981c4db4cf8bf36cdda9d55501983278e3c1816c7ea1bc2662099a8144923ad9"
# The tenth carried patch (ADR-0019): libcrypto's constructor probes the SVE vector length only when the kernel reports SVE as
# well as SVE2; a kernel that reports SVE2 alone (an Android emulator on Apple M4: SME, no SVE) made it die with SIGILL while
# loading. Upstream code (commit openssl/openssl@cb5f5d00e4, on the openssl-4.1 branch as 658a1c947b); dropped with 4.1.1.
patch_10 = "tools/openssl/patches/openssl-4.1.0-armcap-sve2-without-sve.patch"
patch_10_sha256 = "544fe772aa31496dda0d459d10982ff859f94c3fd384763dab7978535d5ae2dc"
# The eleventh carried patch (ADR-0019, not ECH): CVE-2026-121482, a CPU denial of service in certificate verification with CRLs
# (crl_crldp_check built the full name of every relative CRL distribution point of a certificate again for each CRL of its
# issuer, before any signature is checked). Upstream code (commit openssl/openssl@54e14955ef, on the openssl-4.1 branch as
# openssl/openssl@14a9f9ad6e); dropped with 4.1.1.
patch_11 = "tools/openssl/patches/openssl-4.1.0-crl-dp-dos.patch"
patch_11_sha256 = "015b883c6cd5c9ac6c9a0f5d5f00a85daa169c97e576c83d007ef237402936da"
