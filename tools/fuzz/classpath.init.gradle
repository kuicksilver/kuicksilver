// Gradle init script for tools/fuzz/campaign.sh and .clusterfuzzlite/build.sh: compiles the jvmTest classes of every module
// with a Jazzer target in campaign.sh's target table (its third column for the rows of kind jvm) and prints their test
// runtime classpath as one line per module, `FUZZ_CP <module>=<entries separated by ':'>`.
def fuzzModules = { File root ->
    def lines = new File(root, 'tools/fuzz/campaign.sh').readLines()
    def start = lines.findIndexOf { it.startsWith('targets_table() {') }
    def rows = lines.drop(start + 1).takeWhile { it != 'EOF' }.collect { it.trim().split(/\s+/) }
    rows.findAll { it.size() == 5 && it[1] == 'jvm' }.collect { it[2] } as Set
}
allprojects {
    if (name in fuzzModules(rootDir)) {
        afterEvaluate {
            def module = name
            tasks.register('printFuzzClasspath') {
                def cp = configurations.getByName('jvmTestRuntimeClasspath')
                dependsOn 'jvmTestClasses', 'jvmTestProcessResources', cp   // cp: builds the jars of the project dependencies
                def out = layout.buildDirectory.get().asFile
                def own = files("$out/classes/kotlin/jvm/test", "$out/processedResources/jvm/test")
                doLast { println("FUZZ_CP ${module}=" + (own.files + cp.files).join(':')) }
            }
        }
    }
}
