# Ratchet of the API reference, checked by tools/docs/site.sh (tools/docs/site.py check --baseline) on every build of
# the documentation site. A count above or below its line fails the build: a KDoc fix lowers the line in the same
# change, so the baseline never leaves room for a new gap, until both reach 0.
#   undocumented      public declarations without KDoc (Dokka's reportUndocumented, one per declaration)
#   api-broken-links  links of the API pages that point at no page (a KDoc [name] naming a parameter or an internal
#                     member), counted once per page and target
undocumented=152
api-broken-links=181
